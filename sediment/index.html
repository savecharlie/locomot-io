});

// ══════════════════════════════════════
// ── UPDATE ──
// ══════════════════════════════════════

let lastTime = 0;

function update(dt) {
    if (paused || !started) return;

    // Win screen — just tick timer and spawn celebration particles
    if (gameWon) {
        winTimer += dt;
        winParticleTimer -= dt;
        if (winParticleTimer <= 0) {
            winParticleTimer = 0.15;
            const px = Math.random() * W;
            const py = H * 0.3 + Math.random() * H * 0.2;
            const colors = [C.player, C.spring, C.booster, '#FFF0D0', '#FFD080'];
            spawnP(px + cam.x, py + cam.y, colors[Math.floor(Math.random() * colors.length)], 3, 50, 0.8);
        }
        // Allow tap/key to continue to endless mode
        if (winTimer > 2 && jumpBuffered) {
            jumpBuffered = false;
            gameWon = false;
            currentLevel = 25;
            initLevel(currentLevel);
        }
        // Keep particles alive
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.vy += 60 * dt; p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
        }
        return;
    }

    // Time-slow effect (quake juice)
    if (timeSlowTimer > 0) {
        timeSlowTimer -= dt;
        dt *= 0.3; // slow everything to 30% speed
    }

    // Update encounter labels
    for (let i = encounterLabels.length - 1; i >= 0; i--) {
        encounterLabels[i].timer -= dt;
        encounterLabels[i].y -= 20 * dt; // float upward
        if (encounterLabels[i].timer <= 0) encounterLabels.splice(i, 1);
    }

    if (levelTitleTimer > 0) levelTitleTimer -= dt;

    // Level complete — freeze gameplay, count down to next level
    if (levelComplete) {
        levelTransitionTimer -= dt;
        // Keep particles alive during transition
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.vy += 180 * dt; p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
        }
        if (flash.a > 0) flash.a -= dt * 2; // slower flash fade
        if (cam.shake > 0) { cam.sx = (Math.random()*2-1)*cam.shake; cam.sy = (Math.random()*2-1)*cam.shake; cam.shake *= (1-6*dt); if (cam.shake < 0.3) cam.shake = 0; }
        if (levelTransitionTimer <= 0) {
            if (currentLevel >= 24 && !player._hasWon) {
                // BEAT THE GAME!
                player._hasWon = true;
                player._highestLevel = Math.max(player._highestLevel || 1, 25);
                player._bestRun = Math.max(player._bestRun || 0, 24);
                saveProgress();
                gameWon = true;
                winTimer = 0;
                winParticleTimer = 0;
                return;
            }
            currentLevel++;
            if (currentLevel > (player._highestLevel || 1)) {
                player._highestLevel = currentLevel;
            }
            player._bestRun = Math.max(player._bestRun || 0, currentLevel - 1);
            saveProgress();
            initLevel(currentLevel);
        }
        return;
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 180 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Flash
    if (flash.a > 0) flash.a -= dt * 4;
    if (quakeFlash > 0) quakeFlash -= dt;

    // Quake invincibility countdown + sparkle trail
    if (player.quakeTimer > 0) {
        player.quakeTimer -= dt;
        if (Math.random() < 0.5) {
            const cx = player.x + getShapeCenterX(player.shape, player.rotation);
            const cy = player.y + getShapeCenterY(player.shape, player.rotation);
            spawnP(cx + (Math.random() - 0.5) * 24, cy + (Math.random() - 0.5) * 24,
                Math.random() < 0.5 ? '#FFD080' : C.player, 1, 25, 0.4);
        }
    }

    // Falling group
    updateFallingGroup(dt);

    // Clear animations
    updatePendingClears(dt);

    // Camera — use bounding box center of shape
    const shapeCX = player.x + getShapeCenterX(player.shape, player.rotation);
    const targetX = shapeCX - W / 2 + 40;
    cam.x += (targetX - cam.x) * 6 * dt;
    cam.y = 0;
    if (cam.shake > 0) {
        cam.sx = (Math.random() * 2 - 1) * cam.shake;
        cam.sy = (Math.random() * 2 - 1) * cam.shake;
        cam.shake *= (1 - 10 * dt);
        if (cam.shake < 0.3) { cam.shake = 0; cam.sx = 0; cam.sy = 0; }
    }

    if (player.dead) {
        player.deathTimer += dt;
        if (player.deathTimer > 0.5) respawn();
        return;
    }

    // NN agent: inject actions when in bot mode (rate-limited to ~8 actions/sec)
    if (typeof nnAgent !== 'undefined' && nnAgent.active) {
        if (!nnAgent._cooldown) nnAgent._cooldown = 0;
        if (!nnAgent._jumpCD) nnAgent._jumpCD = 0;
        // Reset jump cooldown on landing
        if (player.onGround && !nnAgent._wasGround) nnAgent._jumpCD = 0;
        nnAgent._wasGround = player.onGround;
        if (nnAgent._jumpCD > 0) nnAgent._jumpCD -= dt;
        nnAgent._cooldown -= dt;
        if (nnAgent._cooldown <= 0) {
            const act = nnAgent.getAction();
            if (act === 1 && nnAgent._jumpCD <= 0) {
                jumpBuffered = true;
                nnAgent._jumpCD = 0.25;
            }
            else if (act === 2) tryRotate(1);
            else if (act === 3) tryRotate(-1);
            // no voluntary die — stuck detector jumps instead, hazards handle death
            nnAgent._cooldown = 0.12;
        }
    }

    // Squash lerp
    player.squash += (1 - player.squash) * 10 * dt;

    // Trail (only during spin boost/brake or on booster material)
    if (player.boostTimer > 0) player.trail.unshift({ x: player.x, y: player.y, life: 0.12 });
    for (let i = player.trail.length - 1; i >= 0; i--) {
        player.trail[i].life -= dt;
        if (player.trail[i].life <= 0) player.trail.splice(i, 1);
    }
    while (player.trail.length > 4) player.trail.pop();

    // Boost timer
    if (player.boostTimer > 0) player.boostTimer -= dt;
    if (player.spinCooldown > 0) player.spinCooldown -= dt;
    if (player.rotateCooldown > 0) player.rotateCooldown -= dt;

    // Auto-run
    if (player.boostTimer <= 0) {
        player.vx = RUN_SPEED;
        player.facing = 1;
    }

    // Gravity
    player.vy += GRAVITY * dt;
    if (player.vy > 400) player.vy = 400;

    // Wall detection
    player.onWall = 0;
    if (!player.onGround) {
        // Check right side of bounding box
        const bounds = shapeBounds(player.shape, player.rotation);
        const rightEdge = player.x + (bounds.maxC + 1) * TILE;
        // Check if any cell has solid to its right
        const cells = getCells(player.shape, player.rotation);
        for (const [cx, cy] of cells) {
            const checkX = player.x + (cx + 1) * TILE;
            const checkY = player.y + cy * TILE;
            if (tileIsSolid(Math.floor(checkX / TILE), Math.floor((checkY + TILE/2) / TILE))) {
                player.onWall = 1;
                break;
            }
        }
    }

    // Wall slide
    if (player.onWall !== 0 && player.vy > 0) {
        player.vy = Math.min(player.vy, WALL_SLIDE_SPEED);
        if (Math.random() < 0.3) {
            const bounds = shapeBounds(player.shape, player.rotation);
            spawnP(player.x + (bounds.maxC + 1) * TILE, player.y + bounds.h * TILE / 2, C.tile, 1, 15, 0.2);
        }
    }

    // Coyote time
    if (player.onGround) {
        player.coyoteTimer = 0.06;
        player.jumpsLeft = 2;
    } else {
        player.coyoteTimer -= dt;
    }

    // Jump
    if (jumpBuffered) {
        jumpBuffered = false;
        if (player.onWall !== 0) {
            player.vx = -player.onWall * 180;
            player.vy = JUMP_FORCE * 0.9;
            player.facing = -player.onWall;
            player.jumpsLeft = 1;
            player.boostTimer = 0.15;
            player.squash = 1.3;
            const bounds = shapeBounds(player.shape, player.rotation);
            spawnP(player.x + (bounds.maxC + 1) * TILE, player.y + bounds.h * TILE / 2, C.tile, 4, 40, 0.2);
            SFX.jump();
            haptic(HAPTICS.jump);
        } else if (player.onGround || player.coyoteTimer > 0) {
            player.vy = JUMP_FORCE;
            player.onGround = false;
            player.coyoteTimer = 0;
            player.jumpsLeft = 1;
            player.squash = 1.3;
            const cx = player.x + getShapeCenterX(player.shape, player.rotation);
            const bounds = shapeBounds(player.shape, player.rotation);
            spawnP(cx, player.y + (bounds.maxR + 1) * TILE, C.player, 3, 25, 0.15);
            SFX.jump();
            haptic(HAPTICS.jump);
        } else if (player.jumpsLeft > 0) {
            player.vy = JUMP_FORCE * 0.7;
            player.jumpsLeft = 0;
            player.squash = 1.2;
            const cx = player.x + getShapeCenterX(player.shape, player.rotation);
            const bounds = shapeBounds(player.shape, player.rotation);
            spawnP(cx, player.y + (bounds.maxR + 1) * TILE, 'rgba(232,168,56,0.5)', 4, 35, 0.2);
            SFX.doubleJump();
            haptic(HAPTICS.doubleJump);
        }
    }

    // Move X
    const wasInAir = !player.onGround;
    let hitWallX = false;
    const dx = player.vx * dt;
    if (dx !== 0) {
        const sign = dx > 0 ? 1 : -1;
        const steps = Math.ceil(Math.abs(dx));
        for (let i = 0; i < steps; i++) {
            const step = Math.min(1, Math.abs(dx) - i) * sign;
            if (!tetSolid(player.x + step, player.y, player.shape, player.rotation)) {
                player.x += step;
            } else {
                hitWallX = true;
                player.vx = 0;
                break;
            }
        }
    }

    // Booster: hit from side during X movement
    if (hitWallX) {
        const dir = dx > 0 ? 'right' : 'left';
        const bh = checkAdjacentCorpse(player.x, player.y, player.shape, player.rotation, dir, 'booster');
        if (bh) {
            const now = performance.now() / 1000;
            const key = `${bh.tx},${bh.ty}`;
            if (!player._lastBoost || player._lastBoost.key !== key || (now - player._lastBoost.time) > 0.5) {
                player._lastBoost = { key, time: now };
                player.vx = (dx > 0 ? 1 : -1) * 350;
                player.vy = JUMP_FORCE * 0.5;
                player.jumpsLeft = 1;
                player.boostTimer = 0.25;
                player.squash = 1.5;
                cam.shake = Math.max(cam.shake, 4);
                spawnP(bh.tx * TILE + TILE/2, bh.ty * TILE + TILE/2, C.booster, 7, 70, 0.3);
                SFX.booster();
                haptic(HAPTICS.booster);
                if (!player._hitBooster) { player._hitBooster = true; encounterLabel('BOOST!', bh.tx * TILE + TILE/2, bh.ty * TILE + TILE/2, C.booster); }
            }
        }
    }

    // Move Y
    const prevVY = player.vy;
    player.onGround = false;
    let hitCeiling = false;
    const dy = player.vy * dt;
    if (dy !== 0) {
        const sign = dy > 0 ? 1 : -1;
        const steps = Math.ceil(Math.abs(dy));
        for (let i = 0; i < steps; i++) {
            const step = Math.min(1, Math.abs(dy) - i) * sign;
            if (!tetSolid(player.x, player.y + step, player.shape, player.rotation)) {
                player.y += step;
            } else {
                if (player.vy > 0) {
                    player.onGround = true;
                    if (wasInAir && player.vy > 80) {
                        player.squash = 0.6;
                        const cx = player.x + getShapeCenterX(player.shape, player.rotation);
                        const bounds = shapeBounds(player.shape, player.rotation);
                        spawnP(cx, player.y + (bounds.maxR + 1) * TILE, C.player, 3, 30, 0.2);
                        if (player.vy > 250) cam.shake = Math.max(cam.shake, 2);
                        SFX.land();
                        haptic(HAPTICS.land);
                    }
                } else {
                    hitCeiling = true;
                }
                player.vy = 0;
                break;
            }
        }
    }
    if (tetSolid(player.x, player.y + 1, player.shape, player.rotation)) player.onGround = true;

    // ── Corpse block interactions (at collision boundaries) ──

    // SPRING: landed on top → bounce UP
    if (player.onGround && prevVY > 0) {
        const sh = checkAdjacentCorpse(player.x, player.y, player.shape, player.rotation, 'below', 'spring');
        if (sh) {
            player.vy = JUMP_FORCE * 1.5;
            player.onGround = false;
            player.jumpsLeft = 1;
            player.squash = 1.4;
            cam.shake = Math.max(cam.shake, 3);
            spawnP(sh.tx * TILE + TILE/2, sh.ty * TILE, C.spring, 5, 60, 0.3);
            SFX.spring();
            haptic(HAPTICS.spring);
            if (!player._hitSpring) { player._hitSpring = true; encounterLabel('BOUNCE!', sh.tx * TILE + TILE/2, sh.ty * TILE, C.spring); }
        }
    }

    // SPRING: hit from below → bounce DOWN
    if (hitCeiling && prevVY < 0) {
        const sh = checkAdjacentCorpse(player.x, player.y, player.shape, player.rotation, 'above', 'spring');
        if (sh) {
            player.vy = Math.abs(JUMP_FORCE) * 1.2; // positive = downward
            player.squash = 0.7;
            cam.shake = Math.max(cam.shake, 2);
            spawnP(sh.tx * TILE + TILE/2, (sh.ty + 1) * TILE, C.spring, 4, 50, 0.25);
            SFX.spring();
            haptic(HAPTICS.spring);
        }
    }

    // BOOSTER: standing on top → accelerate forward
    if (player.onGround) {
        const bh = checkAdjacentCorpse(player.x, player.y, player.shape, player.rotation, 'below', 'booster');
        if (bh) {
            const now = performance.now() / 1000;
            const key = `${bh.tx},${bh.ty}`;
            if (!player._lastBoost || player._lastBoost.key !== key || (now - player._lastBoost.time) > 0.5) {
                player._lastBoost = { key, time: now };
                player.vx = player.facing * 350;
                player.vy = JUMP_FORCE * 0.3;
                player.jumpsLeft = 1;
                player.boostTimer = 0.25;
                player.squash = 1.5;
                cam.shake = Math.max(cam.shake, 4);
                spawnP(bh.tx * TILE + TILE/2, bh.ty * TILE + TILE/2, C.booster, 7, 70, 0.3);
                SFX.booster();
                haptic(HAPTICS.booster);
                if (!player._hitBooster) { player._hitBooster = true; encounterLabel('BOOST!', bh.tx * TILE + TILE/2, bh.ty * TILE + TILE/2, C.booster); }
            }
        }
    }

    // Stuck detection — Monte Carlo look-ahead
    // Uses hitWallX from actual movement (not re-check) + escape simulation
    // If no escape route exists → die. If escape exists → wait forever (timing buzzsaws etc.)
    if (hitWallX && dx > 0 && !canEscapeRight()) {
        player.stuckTimer += dt;
        if (player.stuckTimer > 0.5) {
            die();
            return;
        }
    } else {
        player.stuckTimer = 0;
    }

    // Void death (auto-bounce when invincible)
    if (player.y > levelH * TILE + 20) {
        if (player.quakeTimer > 0) {
            // Bounce back up from chasm bottom
            player.vy = -420;
            player.y = levelH * TILE - TILE;
            player.grounded = false;
            player.jumpsLeft = 2;
            cam.shake = Math.max(cam.shake, 6);
            SFX.spring();
            haptic(HAPTICS.spring);
        } else {
            die();
            return;
        }
    }

    // Update moving platforms + carry/push player + platform-platform collision
    for (const p of movingPlatforms) {
        const prevX = p.x, prevY = p.y;
        const t = performance.now() / 1000;
        if (p.vertical) {
            p.y = p.baseY + Math.sin(t * p.speed * 0.05 + p.phase) * p.range;
        } else {
            p.x = p.baseX + Math.sin(t * p.speed * 0.05 + p.phase) * p.range;
        }

        // Platform-platform collision: if overlapping another, clamp back
        for (const other of movingPlatforms) {
            if (other === p) continue;
            if (platformsOverlap(p, other)) {
                if (p.vertical) {
                    // Push apart vertically
                    if (p.y < other.y) {
                        p.y = other.y - TILE;
                    } else {
                        p.y = other.y + TILE;
                    }
                } else {
                    // Push apart horizontally
                    if (p.x < other.x) {
                        p.x = other.x - p.w * TILE;
                    } else {
                        p.x = other.x + other.w * TILE;
                    }
                }
            }
        }

        // Push corpse blocks out of the way (chain-push entire rows)
        {
            const ptx1 = Math.floor(p.x / TILE);
            const ptx2 = Math.floor((p.x + p.w * TILE - 1) / TILE);
            const pty = Math.floor(p.y / TILE);
            const pty2 = Math.floor((p.y + TILE - 1) / TILE);
            for (let ty = pty; ty <= pty2; ty++) {
                for (let tx = ptx1; tx <= ptx2; tx++) {
                    if (ty < 0 || ty >= levelH || !corpseGrid[ty] || !corpseGrid[ty][tx]) continue;
                    if (p.vertical) {
                        const dir = (p.y - prevY) >= 0 ? 1 : -1;
                        // Collect chain of corpses in push direction
                        const chain = [];
                        let scan = ty;
                        while (scan >= 0 && scan < levelH && corpseGrid[scan] && corpseGrid[scan][tx]) {
                            chain.push(scan);
                            scan += dir;
                        }
                        // scan is now the first empty/wall tile after the chain
                        // Check if any tile in the chain is still inside the platform
                        // and find the first open slot past the platform
                        let openSlot = scan;
                        while (openSlot >= 0 && openSlot < levelH) {
                            const px2 = openSlot * TILE;
                            if (px2 + TILE > p.y && px2 < p.y + TILE) { openSlot += dir; continue; }
                            break;
                        }
                        const wallBlock = openSlot < 1 || openSlot >= levelH ||
                                          (level[openSlot] && level[openSlot][tx] === 1);
                        if (!wallBlock) {
                            // Shift entire chain by 1 in dir (work from far end)
                            for (let i = chain.length - 1; i >= 0; i--) {
                                const from = chain[i], to = from + dir;
                                if (to >= 1 && to < levelH) {
                                    if (!corpseGrid[to]) corpseGrid[to] = [];
                                    corpseGrid[to][tx] = corpseGrid[from][tx];
                                }
                                corpseGrid[from][tx] = null;
                            }
                        } else {
                            // Chain is against a wall — crush the last block, shift rest
                            if (chain.length > 0) {
                                const crushIdx = chain[chain.length - 1];
                                const crushBlock = corpseGrid[crushIdx][tx];
                                spawnP(tx * TILE + TILE/2, crushIdx * TILE + TILE/2, matColor(crushBlock.mat), 6, 50, 0.3);
                                corpseGrid[crushIdx][tx] = null;
                                for (let i = chain.length - 2; i >= 0; i--) {
                                    const from = chain[i], to = from + dir;
                                    if (to >= 1 && to < levelH) {
                                        if (!corpseGrid[to]) corpseGrid[to] = [];
                                        corpseGrid[to][tx] = corpseGrid[from][tx];
                                    }
                                    corpseGrid[from][tx] = null;
                                }
                            }
                        }
                    } else {
                        const dir = (p.x - prevX) >= 0 ? 1 : -1;
                        const maxX = segments.length * SEGMENT_W;
                        // Collect chain
                        const chain = [];
                        let scan = tx;
                        while (scan >= 0 && scan < maxX && corpseGrid[ty] && corpseGrid[ty][scan]) {
                            chain.push(scan);
                            scan += dir;
                        }
                        let openSlot = scan;
                        while (openSlot >= 0 && openSlot < maxX) {
                            const px2 = openSlot * TILE;
                            if (px2 + TILE > p.x && px2 < p.x + p.w * TILE) { openSlot += dir; continue; }
                            break;
                        }
                        const wallBlock = openSlot < 0 || openSlot >= maxX ||
                                          (level[ty] && level[ty][openSlot] === 1);
                        if (!wallBlock) {
                            for (let i = chain.length - 1; i >= 0; i--) {
                                const from = chain[i], to = from + dir;
                                if (to >= 0 && to < maxX) {
                                    if (!corpseGrid[ty]) corpseGrid[ty] = [];
                                    corpseGrid[ty][to] = corpseGrid[ty][from];
                                }
                                corpseGrid[ty][from] = null;
                            }
                        } else {
                            if (chain.length > 0) {
                                const crushIdx = chain[chain.length - 1];
                                const crushBlock = corpseGrid[ty][crushIdx];
                                spawnP(crushIdx * TILE + TILE/2, ty * TILE + TILE/2, matColor(crushBlock.mat), 6, 50, 0.3);
                                corpseGrid[ty][crushIdx] = null;
                                for (let i = chain.length - 2; i >= 0; i--) {
                                    const from = chain[i], to = from + dir;
                                    if (to >= 0 && to < maxX) {
                                        if (!corpseGrid[ty]) corpseGrid[ty] = [];
                                        corpseGrid[ty][to] = corpseGrid[ty][from];
                                    }
                                    corpseGrid[ty][from] = null;
                                }
                            }
                        }
                    }
                }
            }
        }

        if (!player.dead) {
            const deltaX = p.x - prevX;
            const deltaY = p.y - prevY;

            // Carry player if standing on this platform
            const cells = getCells(player.shape, player.rotation);
            let carried = false;
            for (const [cx, cy] of cells) {
                const footTX = Math.floor((player.x + cx * TILE + TILE/2) / TILE);
                const footTY = Math.floor((player.y + (cy + 1) * TILE) / TILE);
                const px1 = Math.floor(prevX / TILE);
                const ppy = Math.floor(prevY / TILE);
                if (footTY === ppy && footTX >= px1 && footTX < px1 + p.w) {
                    player.x += deltaX;
                    player.y += deltaY;
                    carried = true;
                    break;
                }
            }

            // Push player if platform moved into them (and wasn't already carried)
            if (!carried && tetOverlapsPlatform(player.x, player.y, player.shape, player.rotation, p)) {
                // Push in the platform's movement direction
                const pushX = deltaX, pushY = deltaY;
                let pushed = false;

                // Try pushing by the platform delta first
                if (!tetSolid(player.x + pushX, player.y + pushY, player.shape, player.rotation) ||
                    !tetOverlapsPlatform(player.x + pushX, player.y + pushY, player.shape, player.rotation, p)) {
                    player.x += pushX;
                    player.y += pushY;
                    pushed = true;
                }

                // If still overlapping, nudge pixel by pixel away from platform center
                if (!pushed || tetOverlapsPlatform(player.x, player.y, player.shape, player.rotation, p)) {
                    const platCX = p.x + (p.w * TILE) / 2;
                    const platCY = p.y + TILE / 2;
                    const playerCX = player.x + getShapeCenterX(player.shape, player.rotation);
                    const bounds = shapeBounds(player.shape, player.rotation);
                    const playerCY = player.y + ((bounds.minR + bounds.maxR) / 2) * TILE;
                    const awayX = playerCX >= platCX ? 1 : -1;
                    const awayY = playerCY >= platCY ? 1 : -1;

                    for (let nudge = 1; nudge <= TILE * 2; nudge++) {
                        // Try horizontal push
                        if (!tetSolid(player.x + awayX * nudge, player.y, player.shape, player.rotation) &&
                            !tetOverlapsPlatform(player.x + awayX * nudge, player.y, player.shape, player.rotation, p)) {
                            player.x += awayX * nudge;
                            pushed = true;
                            break;
                        }
                        // Try vertical push
                        if (!tetSolid(player.x, player.y + awayY * nudge, player.shape, player.rotation) &&
                            !tetOverlapsPlatform(player.x, player.y + awayY * nudge, player.shape, player.rotation, p)) {
                            player.y += awayY * nudge;
                            pushed = true;
                            break;
                        }
                    }

                    // Completely stuck — crushed
                    if (!pushed && tetOverlapsPlatform(player.x, player.y, player.shape, player.rotation, p)) {
                        die();
                        return;
                    }
                }
            }
        }
    }

    // Update buzzsaws
    for (const saw of buzzsaws) {
        saw.spin += dt * 8;
        const t = performance.now() / 1000;
        if (saw.vertical) {
            saw.y = saw.baseY + Math.sin(t * saw.speed * 0.05 + saw.phase) * saw.range;
        } else {
            saw.x = saw.baseX + Math.sin(t * saw.speed * 0.05 + saw.phase) * saw.range;
        }
    }

    // Spike check (skipped during quake invincibility)
    if (player.quakeTimer <= 0 && tetSpike(player.x, player.y, player.shape, player.rotation)) {
        die();
        return;
    }

    // Buzzsaw collision (skipped during quake invincibility)
    if (player.quakeTimer <= 0) {
        const sawCells = getCells(player.shape, player.rotation);
        for (const saw of buzzsaws) {
            for (const [cx, cy] of sawCells) {
                const cellX = player.x + cx * TILE;
                const cellY = player.y + cy * TILE;
                const nearX = Math.max(cellX, Math.min(saw.x, cellX + TILE));
                const nearY = Math.max(cellY, Math.min(saw.y, cellY + TILE));
                const ddx = nearX - saw.x;
                const ddy = nearY - saw.y;
                if (ddx * ddx + ddy * ddy < saw.r * saw.r) {
                    die();
                    return;
                }
            }
        }
    }

    // Track distance (only while alive and inside the level)
    if (!player.dead && player.y >= 0 && player.y < levelH * TILE) {
        player.distance = Math.max(player.distance, Math.floor(player.x / TILE));
        if (player.distance > player.bestDistance) player.bestDistance = player.distance;
    }

    // Goal detection — any cell crosses the finish line?
    const bounds = shapeBounds(player.shape, player.rotation);
    const rightmostX = player.x + (bounds.maxC + 1) * TILE;
    if (!levelComplete && rightmostX >= goalX) {
        levelComplete = true;
        levelTransitionTimer = 3.0;
        console.log('HIGHLIGHT:LEVEL_COMPLETE:' + performance.now().toFixed(0) + ':L' + currentLevel);
        cam.shake = Math.max(cam.shake, 10);
        flash.a = 1.0; flash.r = 0.91; flash.g = 0.84; flash.b = 0.42;
        // Big celebration particles
        const cx = player.x + getShapeCenterX(player.shape, player.rotation);
        const cy = player.y + getShapeCenterY(player.shape, player.rotation);
        spawnP(cx, cy, C.player, 30, 120, 0.6);
        spawnP(cx, cy, '#FFF0D0', 20, 80, 0.5);
        if (currentLevel >= 24) {
            SFX.win();
            haptic(HAPTICS.win);
        } else {
            SFX.levelComplete();
            haptic(HAPTICS.levelClear);
        }
    }
}

// ══════════════════════════════════════
// ── DRAW ──
// ══════════════════════════════════════

function draw() {
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(-Math.floor(cam.x + cam.sx), -Math.floor(cam.y + cam.sy));

    // Visible tile range
    const tl = Math.max(0, Math.floor(cam.x / TILE) - 1);
    const tr = Math.floor((cam.x + W) / TILE) + 1;
    const tt = Math.max(0, Math.floor(cam.y / TILE) - 1);
    const tb = Math.min(levelH - 1, Math.floor((cam.y + H) / TILE) + 1);

    // Terrain tiles
    for (let y = tt; y <= tb; y++) {
        for (let x = tl; x <= tr; x++) {
            if (!level[y] || level[y][x] === undefined) continue;
            const t = level[y][x];
            const px = x * TILE;
            const py = y * TILE;

            if (t === 1) {
                ctx.fillStyle = C.tile;
                ctx.fillRect(px, py, TILE, TILE);
                ctx.fillStyle = C.tileHL;
                ctx.fillRect(px, py, TILE, 1);
                ctx.fillRect(px, py, 1, TILE);
                ctx.fillStyle = C.tileSH;
                ctx.fillRect(px, py + TILE - 1, TILE, 1);
                ctx.fillRect(px + TILE - 1, py, 1, TILE);
            } else if (t === 2) {
                // Directional spikes based on position
                ctx.fillStyle = C.spike;
                ctx.beginPath();
                if (y <= 1) {
                    // Ceiling → point DOWN
                    ctx.moveTo(px + 1, py);
                    ctx.lineTo(px + TILE/2, py + TILE - 2);
                    ctx.lineTo(px + TILE - 1, py);
                    ctx.fill();
                    ctx.fillStyle = '#F08060';
                    ctx.fillRect(px + TILE/2 - 0.5, py + TILE - 4, 1, 2);
                } else if (y >= levelH - 2) {
                    // Floor → point UP
                    ctx.moveTo(px + 1, py + TILE);
                    ctx.lineTo(px + TILE/2, py + 2);
                    ctx.lineTo(px + TILE - 1, py + TILE);
                    ctx.fill();
                    ctx.fillStyle = '#F08060';
                    ctx.fillRect(px + TILE/2 - 0.5, py + 2, 1, 2);
                } else {
                    // Floating → point LEFT (toward player)
                    ctx.moveTo(px + TILE, py + 1);
                    ctx.lineTo(px + 2, py + TILE/2);
                    ctx.lineTo(px + TILE, py + TILE - 1);
                    ctx.fill();
                    ctx.fillStyle = '#F08060';
                    ctx.fillRect(px + 2, py + TILE/2 - 0.5, 2, 1);
                }
            }
        }
    }

    // Corpse grid blocks
    for (let y = tt; y <= tb; y++) {
        for (let x = tl; x <= tr; x++) {
            if (!corpseGrid[y] || !corpseGrid[y][x]) continue;
            const block = corpseGrid[y][x];
            const px = x * TILE;
            const py = y * TILE;
            block.age = Math.min(1, (block.age || 0) + 0.02);

            ctx.globalAlpha = block.age;
            // Clearing flash — blink white
            if (block.clearing) {
                const blink = Math.sin(performance.now() / 40) > 0;
                ctx.fillStyle = blink ? '#FFFFF0' : matColor(block.mat);
                ctx.fillRect(px, py, TILE, TILE);
                ctx.globalAlpha = 1;
                continue;
            }
            // Block body
            ctx.fillStyle = matColor(block.mat);
            ctx.fillRect(px, py, TILE, TILE);
            // Highlight top/left
            ctx.fillStyle = matHL(block.mat);
            ctx.fillRect(px, py, TILE, 1);
            ctx.fillRect(px, py, 1, TILE);
            // Shadow bottom/right
            ctx.fillStyle = matDark(block.mat);
            ctx.fillRect(px, py + TILE - 1, TILE, 1);
            ctx.fillRect(px + TILE - 1, py, 1, TILE);

            // Material decoration (spike material becomes terrain, never a corpse block)
            if (block.mat === 'spring') {
                // Zigzag spring coil — chunky 2px-tall rungs
                ctx.fillStyle = C.springHL;
                ctx.fillRect(px + 2, py + 2, 4, 2);
                ctx.fillRect(px + 6, py + 5, 4, 2);
                ctx.fillRect(px + 2, py + 8, 4, 2);
            } else if (block.mat === 'booster') {
                ctx.fillStyle = C.boosterHL;
                ctx.beginPath();
                ctx.moveTo(px + 9, py + TILE/2);
                ctx.lineTo(px + 4, py + TILE/2 - 3);
                ctx.lineTo(px + 4, py + TILE/2 + 3);
                ctx.fill();
            }

            // Dead face — X eyes + tongue out
            if (block.eyes) {
                ctx.fillStyle = matDark(block.mat);
                // Left eye X
                ctx.fillRect(px + 1, py + 1, 1, 1);
                ctx.fillRect(px + 3, py + 1, 1, 1);
                ctx.fillRect(px + 2, py + 2, 1, 1);
                ctx.fillRect(px + 1, py + 3, 1, 1);
                ctx.fillRect(px + 3, py + 3, 1, 1);
                // Right eye X
                ctx.fillRect(px + 7, py + 1, 1, 1);
                ctx.fillRect(px + 9, py + 1, 1, 1);
                ctx.fillRect(px + 8, py + 2, 1, 1);
                ctx.fillRect(px + 7, py + 3, 1, 1);
                ctx.fillRect(px + 9, py + 3, 1, 1);
                // Mouth line
                ctx.fillRect(px + 3, py + 6, 5, 1);
                // Tongue blep
                ctx.fillStyle = '#E07080';
                ctx.fillRect(px + 6, py + 7, 2, 2);
            }

            ctx.globalAlpha = 1;
        }
    }

    // Falling group (tetromino shape falling as a unit)
    if (fallingGroup) {
        for (const cell of fallingGroup.cells) {
            const px = cell.x * TILE;
            const py = (cell.y + fallingGroup.drop) * TILE;
            ctx.fillStyle = matColor(cell.mat);
            ctx.fillRect(px, py, TILE, TILE);
            ctx.fillStyle = matHL(cell.mat);
            ctx.fillRect(px, py, TILE, 1);
            ctx.fillRect(px, py, 1, TILE);
            ctx.fillStyle = matDark(cell.mat);
            ctx.fillRect(px, py + TILE - 1, TILE, 1);
            ctx.fillRect(px + TILE - 1, py, 1, TILE);
            // Kawaii face on the falling piece (scared!)
            if (cell.eyes) {
                ctx.fillStyle = matDark(cell.mat);
                ctx.fillRect(px + 1, py + 2, 3, 3);
                ctx.fillRect(px + 7, py + 2, 3, 3);
                // Catchlight
                ctx.fillStyle = '#FFFFF0';
                ctx.fillRect(px + 2, py + 2, 1, 1);
                ctx.fillRect(px + 8, py + 2, 1, 1);
                // Scared O mouth (rounded)
                ctx.fillStyle = matDark(cell.mat);
                ctx.fillRect(px + 5, py + 7, 1, 1);
                ctx.fillRect(px + 4, py + 8, 1, 1);
                ctx.fillRect(px + 6, py + 8, 1, 1);
                ctx.fillRect(px + 5, py + 9, 1, 1);
            }
        }
    }

    // Goal line — golden finish
    if (goalX > cam.x - 20 && goalX < cam.x + W + 20) {
        const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 200);
        ctx.globalAlpha = pulse * 0.7;
        ctx.fillStyle = C.player;
        ctx.fillRect(goalX, 0, 3, H);
        // Glow effect
        ctx.globalAlpha = pulse * 0.15;
        ctx.fillRect(goalX - 4, 0, 11, H);
        ctx.globalAlpha = 1;
    }

    // Buzzsaws
    for (const saw of buzzsaws) {
        if (saw.x - saw.r < cam.x - 30 || saw.x + saw.r > cam.x + W + 30) continue;
        ctx.fillStyle = C.saw;
        ctx.beginPath();
        ctx.arc(saw.x, saw.y, saw.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = C.sawBlade;
        for (let i = 0; i < 4; i++) {
            const a = saw.spin + i * Math.PI / 2;
            ctx.fillRect(
                saw.x + Math.cos(a) * (saw.r - 2) - 1,
                saw.y + Math.sin(a) * (saw.r - 2) - 1,
                2, 2
            );
        }
        ctx.fillStyle = '#281820';
        ctx.beginPath();
        ctx.arc(saw.x, saw.y, 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // Moving platforms
    for (const p of movingPlatforms) {
        const px1 = Math.floor(p.x / TILE) * TILE;
        const py = Math.floor(p.y / TILE) * TILE;
        if (px1 + p.w * TILE < cam.x - 20 || px1 > cam.x + W + 20) continue;
        for (let dx = 0; dx < p.w; dx++) {
            const bx = px1 + dx * TILE;
            ctx.fillStyle = C.platform;
            ctx.fillRect(bx, py, TILE, TILE);
            ctx.fillStyle = C.platformHL;
            ctx.fillRect(bx, py, TILE, 1);
            ctx.fillRect(bx, py, 1, TILE);
            ctx.fillStyle = C.platformSH;
            ctx.fillRect(bx, py + TILE - 1, TILE, 1);
            ctx.fillRect(bx + TILE - 1, py, 1, TILE);
        }
        // Direction indicator — small arrow
        const centerX = px1 + (p.w * TILE) / 2;
        ctx.fillStyle = C.platformHL;
        ctx.globalAlpha = 0.5;
        if (p.vertical) {
            ctx.fillRect(centerX - 1, py + 3, 2, TILE - 6);
            ctx.fillRect(centerX - 2, py + 4, 4, 1);
            ctx.fillRect(centerX - 2, py + TILE - 5, 4, 1);
        } else {
            ctx.fillRect(px1 + 3, py + TILE/2, p.w * TILE - 6, 1);
            ctx.fillRect(px1 + 4, py + TILE/2 - 1, 1, 3);
            ctx.fillRect(px1 + p.w * TILE - 5, py + TILE/2 - 1, 1, 3);
        }
        ctx.globalAlpha = 1;
    }

    // Ghost preview — where your piece would snap on death
    if (!player.dead && started) {
        const cells = getCells(player.shape, player.rotation);
        ctx.globalAlpha = 0.15;
        for (const [cx, cy] of cells) {
            const worldPx = player.x + cx * TILE;
            const worldPy = player.y + cy * TILE;
            const gridX = Math.floor(worldPx / TILE);
            const gridY = Math.round(worldPy / TILE);
            ctx.fillStyle = matColor(player.material);
            ctx.fillRect(gridX * TILE, gridY * TILE, TILE, TILE);
        }
        ctx.globalAlpha = 1;
    }

    // Player trail (only behind the player)
    if (!player.dead) {
        const cells = getCells(player.shape, player.rotation);
        for (const t of player.trail) {
            const a = t.life / 0.12;
            ctx.globalAlpha = a * 0.2;
            ctx.fillStyle = matColor(player.material);
            for (const [cx, cy] of cells) {
                const cellRight = t.x + cx * TILE + TILE;
                if (cellRight > player.x) continue;
                ctx.fillRect(t.x + cx * TILE + 1, t.y + cy * TILE + 1, TILE - 2, TILE - 2);
            }
        }
        ctx.globalAlpha = 1;
    }

    // Quake invincibility golden glow
    if (!player.dead && player.quakeTimer > 0) {
        const cells = getCells(player.shape, player.rotation);
        const pulse = 0.4 + 0.4 * Math.sin(performance.now() / 80);
        // Flashing warning when about to expire
        const expiring = player.quakeTimer < 1.0;
        const alpha = expiring ? (Math.sin(performance.now() / 50) > 0 ? pulse : 0) : pulse;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#FFD080'; // golden glow
        for (const [cx, cy] of cells) {
            const px = player.x + cx * TILE;
            const py = player.y + cy * TILE;
            ctx.fillRect(px - 3, py - 3, TILE + 6, TILE + 6);
        }
        ctx.globalAlpha = 1;
    }

    // Player tetromino
    if (!player.dead) {
        const cells = getCells(player.shape, player.rotation);
        const mat = player.material;

        for (let i = 0; i < cells.length; i++) {
            const [cx, cy] = cells[i];
            const px = player.x + cx * TILE;
            const py = player.y + cy * TILE;

            // Squash/stretch around center
            const centerX = player.x + getShapeCenterX(player.shape, player.rotation);
            const centerY = player.y + getShapeCenterY(player.shape, player.rotation);
            const sx = 1 / player.squash;
            const sy = player.squash;
            const drawX = centerX + (px - centerX) * sx + (TILE * (1 - sx)) / 2;
            const drawY = centerY + (py - centerY) * sy + (TILE * (1 - sy)) / 2;
            const drawW = TILE * sx;
            const drawH = TILE * sy;

            // Body
            ctx.fillStyle = matColor(mat);
            ctx.fillRect(drawX, drawY, drawW, drawH);

            // Highlight top/left
            ctx.fillStyle = matHL(mat);
            ctx.fillRect(drawX, drawY, drawW, 1);
            ctx.fillRect(drawX, drawY, 1, drawH);

            // Shadow bottom/right
            ctx.fillStyle = matDark(mat);
            ctx.fillRect(drawX, drawY + drawH - 1, drawW, 1);
            ctx.fillRect(drawX + drawW - 1, drawY, 1, drawH);

            // Eyes on first cell — kawaii alive!
            if (i === 0) {
                const ey = drawY + 2 * sy;
                const sh = player.facing * 1;
                // Dark eye sockets 3x2
                ctx.fillStyle = matDark(mat);
                ctx.fillRect(drawX + 1 + sh, ey, 3, 3);
                ctx.fillRect(drawX + 7 + sh, ey, 3, 3);
                // Catchlight sparkle (top corner, shifts with facing)
                const cx = player.facing >= 0 ? 2 : 0;
                ctx.fillStyle = '#FFFFF0';
                ctx.fillRect(drawX + 1 + sh + cx, ey, 1, 1);
                ctx.fillRect(drawX + 7 + sh + cx, ey, 1, 1);
                // Lower gleam (subtle life)
                ctx.fillStyle = 'rgba(255,255,240,0.35)';
                ctx.fillRect(drawX + 2 + sh, ey + 2, 1, 1);
                ctx.fillRect(drawX + 8 + sh, ey + 2, 1, 1);
                // Mouth — smile on ground, O when airborne
                ctx.fillStyle = matDark(mat);
                if (player.onGround) {
                    // Kawaii smile :3
                    ctx.fillRect(drawX + 4, ey + 5, 1, 1);
                    ctx.fillRect(drawX + 7, ey + 5, 1, 1);
                    ctx.fillRect(drawX + 5, ey + 6, 2, 1);
                } else {
                    // Surprised O (rounded)
                    ctx.fillRect(drawX + 6, ey + 4, 1, 1);
                    ctx.fillRect(drawX + 5, ey + 5, 1, 1);
                    ctx.fillRect(drawX + 7, ey + 5, 1, 1);
                    ctx.fillRect(drawX + 6, ey + 6, 1, 1);
                }
            }

            // Material decoration on other cells
            if (i > 0) {
                if (mat === 'spike') {
                    // Warning spikes on the live piece — small triangles pointing right (forward)
                    ctx.fillStyle = C.corpseSpikeHL;
                    ctx.beginPath();
                    ctx.moveTo(drawX + drawW, drawY + 1);
                    ctx.lineTo(drawX + 2, drawY + drawH/2);
                    ctx.lineTo(drawX + drawW, drawY + drawH - 1);
                    ctx.fill();
                } else if (mat === 'spring') {
                    // Zigzag spring coil — chunky 2px-tall rungs
                    ctx.fillStyle = C.springHL;
                    ctx.fillRect(drawX + 2, drawY + 2, 4, 2);
                    ctx.fillRect(drawX + 6, drawY + 5, 4, 2);
                    ctx.fillRect(drawX + 2, drawY + 8, 4, 2);
                } else if (mat === 'booster') {
                    ctx.fillStyle = C.boosterHL;
                    ctx.beginPath();
                    const d = player.facing;
                    ctx.moveTo(drawX + drawW/2 + d * 3.5, drawY + drawH/2);
                    ctx.lineTo(drawX + drawW/2 - d * 2, drawY + drawH/2 - 2.5);
                    ctx.lineTo(drawX + drawW/2 - d * 2, drawY + drawH/2 + 2.5);
                    ctx.fill();
                }
            }
        }

        // Wall slide indicator
        if (player.onWall !== 0) {
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = C.player;
            const bounds = shapeBounds(player.shape, player.rotation);
            const wx = player.onWall > 0 ? player.x + (bounds.maxC + 1) * TILE : player.x + bounds.minC * TILE - 2;
            ctx.fillRect(wx, player.y + bounds.minR * TILE + 1, 2, bounds.h * TILE - 2);
            ctx.globalAlpha = 1;
        }
    }

    // Golden tint overlay during quake invincibility (drawn ON TOP of player)
    if (!player.dead && player.quakeTimer > 0) {
        const cells = getCells(player.shape, player.rotation);
        const pulse = 0.3 + 0.25 * Math.sin(performance.now() / 100);
        const expiring = player.quakeTimer < 1.0;
        const tint = expiring ? (Math.sin(performance.now() / 50) > 0 ? pulse : 0.05) : pulse;
        ctx.globalAlpha = tint;
        ctx.fillStyle = '#FFD040'; // bright gold tint
        for (const [cx, cy] of cells) {
            const px = player.x + cx * TILE;
            const py = player.y + cy * TILE;
            ctx.fillRect(px, py, TILE, TILE);
        }
        ctx.globalAlpha = 1;
    }

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // First-encounter labels
    for (const lbl of encounterLabels) {
        const fade = Math.min(1, lbl.timer * 2);
        const scale = 1 + (1.5 - lbl.timer) * 0.3;
        ctx.globalAlpha = fade;
        ctx.fillStyle = lbl.color;
        ctx.font = `bold ${Math.round(8 * scale)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(lbl.text, lbl.x, lbl.y);
        ctx.textAlign = 'left';
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // ── HUD ──
    ctx.fillStyle = C.player;
    ctx.font = '8px monospace';
    ctx.fillText(`LEVEL ${currentLevel}`, 4, 10);
    ctx.fillStyle = C.text;
    ctx.font = '7px monospace';
    const totalDist = getSegmentsForLevel(currentLevel) * SEGMENT_W;
    const progress = Math.min(100, Math.floor(player.distance / totalDist * 100));
    const deathStr = `${progress}%  deaths: ${player.deathCount}`;
    // Flash gold during quake invincibility
    if (player.quakeTimer > 0) {
        ctx.fillStyle = `rgba(232,168,56,${0.5 + 0.5 * Math.sin(performance.now() / 80)})`;
    }
    ctx.fillText(deathStr, 4, 20);
    // Show quake count + invincibility timer
    if (player.quakeCount > 0) {
        const deathTextW = ctx.measureText(deathStr).width;
        ctx.fillStyle = '#FFD080';
        const qText = player.quakeTimer > 0
            ? `  QUAKE! ${Math.ceil(player.quakeTimer)}s`
            : `  quakes: ${player.quakeCount}`;
        ctx.fillText(qText, 4 + deathTextW, 20);
    }

    // NN bot indicator
    if (typeof nnAgent !== 'undefined' && nnAgent.active) {
        ctx.fillStyle = '#80FF80';
        ctx.font = '7px monospace';
        ctx.fillText('BOT', W - 22, 10);
    }

    // Shape + material indicator
    ctx.fillStyle = matColor(player.material);
    ctx.font = '7px monospace';
    ctx.fillText(`${player.shape}-piece  ${player.material}`, 4, 32);

    // Next piece preview (top-right, left of pause button)
    if (nextPieceShape && started && !player.dead) {
        const previewX = W - 52;
        const previewY = 4;
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = C.text;
        ctx.font = '6px monospace';
        ctx.textAlign = 'right';
        ctx.fillText('NEXT', previewX - 2, previewY + 6);
        ctx.textAlign = 'left';
        ctx.globalAlpha = 0.7;
        // Draw mini tetromino (half-size tiles)
        const miniTile = 5;
        const nextCells = getCells(nextPieceShape, 0);
        const nextBounds = shapeBounds(nextPieceShape, 0);
        const offsetX = previewX - nextBounds.minC * miniTile;
        const offsetY = previewY - nextBounds.minR * miniTile + 1;
        for (const [cx, cy] of nextCells) {
            ctx.fillStyle = matColor(nextPieceMaterial);
            ctx.fillRect(offsetX + cx * miniTile, offsetY + cy * miniTile, miniTile - 1, miniTile - 1);
        }
        ctx.globalAlpha = 1;
    }

    // Tutorial prompts (level 1) or controls hint
    if ((!hasJumped || !hasRotated || !hasPlaced) && started && !player.dead) {
        // Passive control hints — show next action they haven't done yet
        const pulse = 0.6 + 0.3 * Math.sin(performance.now() / 400);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = C.player;
        ctx.font = '8px monospace';
        ctx.textAlign = 'center';
        if (!hasJumped) ctx.fillText(lastInputWasTouch ? 'tap to jump' : 'SPACE to jump', W/2, H/2 + 8);
        else if (!hasRotated) ctx.fillText(lastInputWasTouch ? 'swipe \u2190 \u2192 to rotate' : 'A / D to rotate', W/2, H/2 + 8);
        else if (!hasPlaced) ctx.fillText(lastInputWasTouch ? 'swipe \u2193 to place' : 'X to place', W/2, H/2 + 8);
        ctx.textAlign = 'left';
        ctx.globalAlpha = 1;
    } else if (player.deathCount < 3 && started) {
        ctx.globalAlpha = Math.max(0, 1 - player.distance / 20);
        ctx.fillStyle = 'rgba(216,208,192,0.35)';
        ctx.font = '6px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(ctrlHint('all'), W/2, H - 6);
        ctx.textAlign = 'left';
        ctx.globalAlpha = 1;
    }

    // Flash
    if (flash.a > 0) {
        ctx.globalAlpha = flash.a * 0.3;
        ctx.fillStyle = `rgb(${flash.r*255},${flash.g*255},${flash.b*255})`;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
    }

    // Start screen
    if (!started) {
        ctx.fillStyle = 'rgba(16, 16, 30, 0.88)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = C.player;
        ctx.font = '14px monospace';
        ctx.fillText('SEDIMENT', W/2, H/2 - 28);
        ctx.fillStyle = 'rgba(232,168,56,0.45)';
        ctx.font = '7px monospace';
        ctx.fillText('you are the shape', W/2, H/2 - 12);
        ctx.fillStyle = C.text;
        ctx.font = '7px monospace';
        ctx.fillText(lastInputWasTouch ? 'tap to start' : 'press any key', W/2, H/2 + 10);
        ctx.fillStyle = 'rgba(216,208,192,0.3)';
        ctx.font = '6px monospace';
        ctx.fillText(ctrlHint('all'), W/2, H/2 + 24);

        // Animated kawaii Crag running across
        const runT = performance.now() / 1000;
        const runX = ((runT * 40) % (W + 60)) - 30;
        const runY = H/2 + 42;
        const bounce = Math.abs(Math.sin(runT * 8)) * 4;
        const tileS = 6; // mini tile size
        const tCells = [[0,0],[1,0],[2,0],[1,1]]; // T-piece (Crag)
        ctx.globalAlpha = 0.5;
        for (let i = 0; i < tCells.length; i++) {
            const [cx, cy] = tCells[i];
            const px = runX + cx * tileS;
            const py = runY - bounce + cy * tileS;
            ctx.fillStyle = C.spring;
            ctx.fillRect(px, py, tileS - 1, tileS - 1);
            if (i === 0) {
                ctx.fillStyle = C.springDark;
                ctx.fillRect(px, py, 1, 1);
                ctx.fillRect(px + 3, py, 1, 1);
                ctx.fillStyle = '#FFFFF0';
                ctx.fillRect(px + 1, py, 1, 1);
                ctx.fillRect(px + 4, py, 1, 1);
            }
        }
        ctx.globalAlpha = 1;

        // Level select (if player has progress)
        const maxUnlocked = Math.max(1, player._highestLevel || 1);
        if (maxUnlocked > 1) {
            const lvlY = H/2 + 38;
            const lvlBtnW = 16, lvlBtnH = 12;
            const lvlLabelW = 64;
            const lvlTotalW = lvlBtnW + lvlLabelW + lvlBtnW;
            const lvlStartX = W/2 - lvlTotalW/2;
            const canLeft = startSelectedLevel > 1;
            const canRight = startSelectedLevel < maxUnlocked;

            ctx.fillStyle = canLeft ? 'rgba(104,187,196,0.2)' : 'rgba(216,208,192,0.05)';
            ctx.fillRect(lvlStartX, lvlY - lvlBtnH/2, lvlBtnW, lvlBtnH);
            ctx.strokeStyle = canLeft ? 'rgba(104,187,196,0.5)' : 'rgba(216,208,192,0.15)';
            ctx.lineWidth = 1;
            ctx.strokeRect(lvlStartX, lvlY - lvlBtnH/2, lvlBtnW, lvlBtnH);
            ctx.fillStyle = canLeft ? '#68BBC4' : 'rgba(216,208,192,0.2)';
            ctx.font = '8px monospace';
            ctx.fillText('<', lvlStartX + lvlBtnW/2, lvlY + 3);

            ctx.fillStyle = 'rgba(104,187,196,0.8)';
            ctx.font = '6px monospace';
            ctx.fillText('LEVEL ' + startSelectedLevel, lvlStartX + lvlBtnW + lvlLabelW/2, lvlY + 2);

            const lvlPlusX = lvlStartX + lvlBtnW + lvlLabelW;
            ctx.fillStyle = canRight ? 'rgba(104,187,196,0.2)' : 'rgba(216,208,192,0.05)';
            ctx.fillRect(lvlPlusX, lvlY - lvlBtnH/2, lvlBtnW, lvlBtnH);
            ctx.strokeStyle = canRight ? 'rgba(104,187,196,0.5)' : 'rgba(216,208,192,0.15)';
            ctx.strokeRect(lvlPlusX, lvlY - lvlBtnH/2, lvlBtnW, lvlBtnH);
            ctx.fillStyle = canRight ? '#68BBC4' : 'rgba(216,208,192,0.2)';
            ctx.font = '8px monospace';
            ctx.fillText('>', lvlPlusX + lvlBtnW/2, lvlY + 3);

            _startLvlLeftBounds = { x: lvlStartX, y: lvlY - lvlBtnH/2, w: lvlBtnW, h: lvlBtnH };
            _startLvlRightBounds = { x: lvlPlusX, y: lvlY - lvlBtnH/2, w: lvlBtnW, h: lvlBtnH };
        } else {
            _startLvlLeftBounds = null;
            _startLvlRightBounds = null;
        }

        // Settings gear (top-left corner)
        const gearX = 4, gearY = 4, gearW = 14, gearH = 14;
        ctx.fillStyle = startShowSettings ? 'rgba(232,168,56,0.3)' : 'rgba(216,208,192,0.15)';
        ctx.fillRect(gearX, gearY, gearW, gearH);
        ctx.strokeStyle = startShowSettings ? 'rgba(232,168,56,0.5)' : 'rgba(216,208,192,0.25)';
        ctx.lineWidth = 1;
        ctx.strokeRect(gearX, gearY, gearW, gearH);
        ctx.fillStyle = startShowSettings ? C.player : 'rgba(216,208,192,0.5)';
        ctx.font = '9px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('\u2699', gearX + gearW/2, gearY + gearH/2 + 3);
        _startGearBounds = { x: gearX, y: gearY, w: gearW, h: gearH };

        // Settings panel (expanded from gear)
        if (startShowSettings) {
            const panelX = 4, panelY = 22, panelW = 90;
            ctx.fillStyle = 'rgba(16, 16, 30, 0.9)';
            ctx.fillRect(panelX, panelY, panelW, supportsVibrate ? 52 : 36);
            ctx.strokeStyle = 'rgba(216,208,192,0.15)';
            ctx.strokeRect(panelX, panelY, panelW, supportsVibrate ? 52 : 36);

            // Music volume row
            const musY = panelY + 10;
            const musW = 14, musH = 12;
            ctx.fillStyle = 'rgba(216,208,192,0.15)';
            ctx.fillRect(panelX + 2, musY - musH/2, musW, musH);
            ctx.fillStyle = C.text; ctx.font = '8px monospace';
            ctx.fillText('-', panelX + 2 + musW/2, musY + 3);
            const musPct = musicMuted ? 'OFF' : Math.round(musicVolume * 100) + '%';
            ctx.fillStyle = musicMuted ? 'rgba(200,56,72,0.7)' : 'rgba(216,208,192,0.6)';
            ctx.font = '5px monospace';
            ctx.fillText('MUS ' + musPct, panelX + 2 + musW + 24, musY + 2);
            const musPlusX = panelX + panelW - musW - 2;
            ctx.fillStyle = 'rgba(216,208,192,0.15)';
            ctx.fillRect(musPlusX, musY - musH/2, musW, musH);
            ctx.fillStyle = C.text; ctx.font = '8px monospace';
            ctx.fillText('+', musPlusX + musW/2, musY + 3);
            _startMusDownBounds = { x: panelX + 2, y: musY - musH/2, w: musW, h: musH };
            _startMusUpBounds = { x: musPlusX, y: musY - musH/2, w: musW, h: musH };

            // SFX toggle
            const sfxY = panelY + 26;
            const sfxBW = panelW - 4, sfxBH = 12;
            ctx.fillStyle = sfxMuted ? 'rgba(200,56,72,0.2)' : 'rgba(88,184,72,0.2)';
            ctx.fillRect(panelX + 2, sfxY - sfxBH/2, sfxBW, sfxBH);
            ctx.fillStyle = sfxMuted ? '#C83848' : C.spring;
            ctx.font = '5px monospace';
            ctx.fillText(sfxMuted ? 'SFX: OFF' : 'SFX: ON', panelX + 2 + sfxBW/2, sfxY + 2);
            _startSfxBounds = { x: panelX + 2, y: sfxY - sfxBH/2, w: sfxBW, h: sfxBH };

            // Haptics toggle
            if (supportsVibrate) {
                const hapY = panelY + 42;
                const hapBW = panelW - 4, hapBH = 12;
                ctx.fillStyle = hapticsEnabled ? 'rgba(88,144,208,0.2)' : 'rgba(200,56,72,0.2)';
                ctx.fillRect(panelX + 2, hapY - hapBH/2, hapBW, hapBH);
                ctx.fillStyle = hapticsEnabled ? C.booster : '#C83848';
                ctx.font = '5px monospace';
                ctx.fillText(hapticsEnabled ? 'HAPTIC: ON' : 'HAPTIC: OFF', panelX + 2 + hapBW/2, hapY + 2);
                _startHapBounds = { x: panelX + 2, y: hapY - hapBH/2, w: hapBW, h: hapBH };
            } else {
                _startHapBounds = null;
            }
        } else {
            _startMusDownBounds = null; _startMusUpBounds = null;
            _startSfxBounds = null; _startHapBounds = null;
        }

        ctx.textAlign = 'left';

        // Credits
        ctx.fillStyle = 'rgba(208,204,196,0.15)';
        ctx.font = '6px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('by Ivy & Iris', 4, H - 4);
        ctx.textAlign = 'right';
        ctx.fillText(VERSION, W - 4, H - 4);
        ctx.textAlign = 'left';
    }


    // Level title (fades in at start of each level)
    if (levelTitleTimer > 0 && started && !levelComplete) {
        const fade = levelTitleTimer < 1 ? levelTitleTimer : Math.min(1, (3 - levelTitleTimer) * 2);
        ctx.globalAlpha = fade;
        ctx.textAlign = 'center';
        ctx.fillStyle = C.player;
        ctx.font = '14px monospace';
        ctx.fillText(`LEVEL ${currentLevel}`, W/2, H/2 - 16);
        ctx.fillStyle = 'rgba(232,168,56,0.5)';
        ctx.font = '7px monospace';
        const LEVEL_NAMES = [
            '',
            'the shallows',      // L1: chasms only
            'the thorns',        // L2: floor spikes
            'the roots',         // L3: deeper organic layer
            'stalactite',        // L4: ceiling spikes
            'the gravel',        // L5: harder ground
            'blood stone',       // L6: spike material
            'the sediment',      // L7: namesake, mid-depth
            'the scaffolding',   // L8: static platforms
            'the quarry',        // L9: open danger
            'sawdust',           // L10: buzzsaws
            'the grinder',       // L11: more saws
            'the conveyor',      // L12: moving platforms (H)
            'the churn',         // L13: everything mixing
            'the maw',           // L14: spiked chasms
            'the crucible',      // L15: intense
            'the needles',       // L16: spike walls
            'the pressure',      // L17: deep, crushing
            'vertigo',           // L18: vertical platforms
            'the gauntlet',      // L19: all mechanics
            'the furnace',       // L20: deep heat
            'the fault line',    // L21: unstable
            'the mantle',        // L22: geological layer
            'the abyss',         // L23: near bottom
            'the core'           // L24: final level
        ];
        const hellName = LEVEL_NAMES[currentLevel] || `circle ${currentLevel}`;
        ctx.fillText(hellName, W/2, H/2);
        ctx.textAlign = 'left';
        ctx.globalAlpha = 1;
    }

    // Level complete overlay
    if (levelComplete) {
        const fade = Math.min(1, (3 - levelTransitionTimer) * 3);
        ctx.globalAlpha = fade * 0.7;
        ctx.fillStyle = C.bg;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = fade;
        ctx.textAlign = 'center';
        ctx.fillStyle = C.player;
        ctx.font = '14px monospace';
        ctx.fillText(`LEVEL ${currentLevel} CLEAR`, W/2, H/2 - 20);
        ctx.fillStyle = C.text;
        ctx.font = '7px monospace';
        ctx.fillText(`deaths: ${levelDeaths}${levelQuakes > 0 ? `  quakes: ${levelQuakes}` : ''}`, W/2, H/2);
        ctx.fillStyle = 'rgba(216,208,192,0.5)';
        ctx.font = '6px monospace';
        if (levelTransitionTimer > 0) {
            ctx.fillText(`next level in ${Math.ceil(levelTransitionTimer)}...`, W/2, H/2 + 14);
        }
        ctx.textAlign = 'left';
        ctx.globalAlpha = 1;
    }

    // Win screen
    if (gameWon) {
        const fade = Math.min(1, winTimer * 2);
        ctx.fillStyle = `rgba(16, 16, 30, ${fade * 0.9})`;
        ctx.fillRect(0, 0, W, H);

        ctx.globalAlpha = fade;
        ctx.textAlign = 'center';

        // Title
        const titlePulse = 1 + Math.sin(winTimer * 3) * 0.05;
        ctx.fillStyle = C.player;
        ctx.font = `${Math.round(16 * titlePulse)}px monospace`;
        ctx.fillText('CONGRATULATIONS', W/2, H/2 - 40);

        // Subtitle
        ctx.fillStyle = '#FFF0D0';
        ctx.font = '8px monospace';
        ctx.fillText('you escaped the sediment', W/2, H/2 - 20);

        // Stats
        ctx.fillStyle = C.text;
        ctx.font = '7px monospace';
        ctx.fillText(`deaths: ${player.deathCount}  quakes: ${player.quakeCount}`, W/2, H/2 + 4);

        // Continue hint
        if (winTimer > 2) {
            const blink = Math.sin(winTimer * 4) > 0;
            if (blink) {
                ctx.fillStyle = 'rgba(216,208,192,0.5)';
                ctx.font = '6px monospace';
                ctx.fillText(lastInputWasTouch ? 'tap to enter endless mode' : 'press any key for endless mode', W/2, H/2 + 36);
            }
        }

        // Render floating particles on win screen
        ctx.save();
        ctx.translate(-Math.floor(cam.x + cam.sx), -Math.floor(cam.y + cam.sy));
        for (const p of particles) {
            ctx.globalAlpha = p.life / p.maxLife;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        ctx.restore();

        ctx.textAlign = 'left';
        ctx.globalAlpha = 1;
    }

    // Pause
    if (paused) {
        ctx.fillStyle = 'rgba(16, 16, 30, 0.8)';
        ctx.fillRect(0, 0, W, H);

        // Vertically center the entire menu block
        const menuH = supportsVibrate ? 115 : 97;
        const menuTop = (H - menuH) / 2;

        ctx.fillStyle = C.text;
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', W/2, menuTop + 12);
        ctx.font = '7px monospace';
        ctx.fillStyle = 'rgba(216,208,192,0.5)';
        ctx.fillText('tap to resume', W/2, menuTop + 26);

        // Skip level button
        const skipY = menuTop + 42;
        const skipW = 70, skipH = 16;
        const skipX = W/2 - skipW/2;
        ctx.fillStyle = 'rgba(232,168,56,0.2)';
        ctx.fillRect(skipX, skipY - skipH/2, skipW, skipH);
        ctx.strokeStyle = 'rgba(232,168,56,0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(skipX, skipY - skipH/2, skipW, skipH);
        ctx.fillStyle = C.player;
        ctx.font = '7px monospace';
        ctx.fillText('RESTART', W/2, skipY + 3);

        // Store button bounds for tap detection (in screen coords)
        _skipBtnBounds = { x: skipX, y: skipY - skipH/2, w: skipW, h: skipH };

        // Level selector row: [ < ] LEVEL X [ > ]
        {
            const lvlY = menuTop + 60;
            const lvlBtnW = 16, lvlBtnH = 14;
            const lvlLabelW = 70;
            const lvlTotalW = lvlBtnW + lvlLabelW + lvlBtnW;
            const lvlStartX = W/2 - lvlTotalW/2;

            // "<" button
            const canGoLeft = _pauseSelectedLevel > 1;
            ctx.fillStyle = canGoLeft ? 'rgba(104,187,196,0.2)' : 'rgba(216,208,192,0.05)';
            ctx.fillRect(lvlStartX, lvlY - lvlBtnH/2, lvlBtnW, lvlBtnH);
            ctx.strokeStyle = canGoLeft ? 'rgba(104,187,196,0.5)' : 'rgba(216,208,192,0.15)';
            ctx.lineWidth = 1;
            ctx.strokeRect(lvlStartX, lvlY - lvlBtnH/2, lvlBtnW, lvlBtnH);
            ctx.fillStyle = canGoLeft ? '#68BBC4' : 'rgba(216,208,192,0.2)';
            ctx.font = '8px monospace';
            ctx.fillText('<', lvlStartX + lvlBtnW/2, lvlY + 3);

            // Level label
            ctx.fillStyle = 'rgba(104,187,196,0.8)';
            ctx.font = '6px monospace';
            ctx.fillText('LEVEL ' + _pauseSelectedLevel, lvlStartX + lvlBtnW + lvlLabelW/2, lvlY + 2);

            // ">" button
            const canGoRight = _pauseSelectedLevel < 24;
            const lvlPlusX = lvlStartX + lvlBtnW + lvlLabelW;
            ctx.fillStyle = canGoRight ? 'rgba(104,187,196,0.2)' : 'rgba(216,208,192,0.05)';
            ctx.fillRect(lvlPlusX, lvlY - lvlBtnH/2, lvlBtnW, lvlBtnH);
            ctx.strokeStyle = canGoRight ? 'rgba(104,187,196,0.5)' : 'rgba(216,208,192,0.15)';
            ctx.lineWidth = 1;
            ctx.strokeRect(lvlPlusX, lvlY - lvlBtnH/2, lvlBtnW, lvlBtnH);
            ctx.fillStyle = canGoRight ? '#68BBC4' : 'rgba(216,208,192,0.2)';
            ctx.font = '8px monospace';
            ctx.fillText('>', lvlPlusX + lvlBtnW/2, lvlY + 3);

            _levelLeftBounds = { x: lvlStartX, y: lvlY - lvlBtnH/2, w: lvlBtnW, h: lvlBtnH };
            _levelRightBounds = { x: lvlPlusX, y: lvlY - lvlBtnH/2, w: lvlBtnW, h: lvlBtnH };
        }

        // Music volume row: [  -  ] MUSIC XX% [  +  ]
        const volY = menuTop + 78;
        const volBtnW = 16, volBtnH = 14;
        const volLabelW = 70;
        const volTotalW = volBtnW + volLabelW + volBtnW;
        const volStartX = W/2 - volTotalW/2;

        // "-" button
        ctx.fillStyle = 'rgba(216,208,192,0.15)';
        ctx.fillRect(volStartX, volY - volBtnH/2, volBtnW, volBtnH);
        ctx.strokeStyle = 'rgba(216,208,192,0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(volStartX, volY - volBtnH/2, volBtnW, volBtnH);
        ctx.fillStyle = C.text;
        ctx.font = '8px monospace';
        ctx.fillText('-', volStartX + volBtnW/2, volY + 3);

        // Volume label
        const volPct = musicMuted ? 'OFF' : Math.round(musicVolume * 100) + '%';
        ctx.fillStyle = musicMuted ? 'rgba(200,56,72,0.7)' : 'rgba(216,208,192,0.6)';
        ctx.font = '6px monospace';
        ctx.fillText('MUSIC ' + volPct, volStartX + volBtnW + volLabelW/2, volY + 2);

        // "+" button
        const plusX = volStartX + volBtnW + volLabelW;
        ctx.fillStyle = 'rgba(216,208,192,0.15)';
        ctx.fillRect(plusX, volY - volBtnH/2, volBtnW, volBtnH);
        ctx.strokeStyle = 'rgba(216,208,192,0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(plusX, volY - volBtnH/2, volBtnW, volBtnH);
        ctx.fillStyle = C.text;
        ctx.font = '8px monospace';
        ctx.fillText('+', plusX + volBtnW/2, volY + 3);

        _volDownBounds = { x: volStartX, y: volY - volBtnH/2, w: volBtnW, h: volBtnH };
        _volUpBounds = { x: plusX, y: volY - volBtnH/2, w: volBtnW, h: volBtnH };

        // SFX toggle button
        const sfxY = menuTop + 94;
        const sfxW = 70, sfxH = 14;
        const sfxX = W/2 - sfxW/2;
        ctx.fillStyle = sfxMuted ? 'rgba(200,56,72,0.2)' : 'rgba(88,184,72,0.2)';
        ctx.fillRect(sfxX, sfxY - sfxH/2, sfxW, sfxH);
        ctx.strokeStyle = sfxMuted ? 'rgba(200,56,72,0.5)' : 'rgba(88,184,72,0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(sfxX, sfxY - sfxH/2, sfxW, sfxH);
        ctx.fillStyle = sfxMuted ? '#C83848' : C.spring;
        ctx.font = '6px monospace';
        ctx.fillText(sfxMuted ? 'SFX: OFF' : 'SFX: ON', W/2, sfxY + 2);

        _sfxBtnBounds = { x: sfxX, y: sfxY - sfxH/2, w: sfxW, h: sfxH };

        // Haptics toggle button (only show on devices that support it)
        if (supportsVibrate) {
            const hapY = menuTop + 110;
            const hapW = 70, hapH = 14;
            const hapX = W/2 - hapW/2;
            ctx.fillStyle = hapticsEnabled ? 'rgba(88,144,208,0.2)' : 'rgba(200,56,72,0.2)';
            ctx.fillRect(hapX, hapY - hapH/2, hapW, hapH);
            ctx.strokeStyle = hapticsEnabled ? 'rgba(88,144,208,0.5)' : 'rgba(200,56,72,0.5)';
            ctx.lineWidth = 1;
            ctx.strokeRect(hapX, hapY - hapH/2, hapW, hapH);
            ctx.fillStyle = hapticsEnabled ? C.booster : '#C83848';
            ctx.textAlign = 'center';
            ctx.font = '6px monospace';
            ctx.fillText(hapticsEnabled ? 'HAPTIC: ON' : 'HAPTIC: OFF', W/2, hapY + 2);
            _hapticBtnBounds = { x: hapX, y: hapY - hapH/2, w: hapW, h: hapH };
        } else {
            _hapticBtnBounds = null;
        }

        _muteBtnBounds = null; // replaced by new controls
        ctx.textAlign = 'left';
    } else {
        _skipBtnBounds = null;
        _muteBtnBounds = null;
        _volDownBounds = null;
        _volUpBounds = null;
        _sfxBtnBounds = null;
        _hapticBtnBounds = null;
        _levelLeftBounds = null;
        _levelRightBounds = null;
    }
}

// ── Visibility — pause on background ──
document.addEventListener('visibilitychange', () => {
    if (document.hidden && started && !paused) {
        togglePause();
    }
    if (document.hidden && audioCtx && audioCtx.state === 'running') {
        audioCtx.suspend();
    }
    if (!document.hidden && audioCtx && audioCtx.state === 'suspended' && !paused) {
        audioCtx.resume();
    }
});
window.addEventListener('beforeunload', saveProgress);

// ── Android back button ──
if (started === false) history.replaceState({ sediment: 'start' }, '');
window.addEventListener('popstate', (e) => {
    if (started) {
        e.preventDefault();
        history.pushState({ sediment: 'playing' }, '');
        if (!paused) togglePause();
    }
});

// ── Loop ──
let _loopError = false;
function loop(time) {
    if (_loopError) return;
    try {
        const dt = Math.min((time - lastTime) / 1000, 1/20);
        lastTime = time;
        update(dt);
        draw();
    } catch (err) {
        console.error('Game loop error:', err);
        _loopError = true;
        ctx.fillStyle = 'rgba(16, 16, 30, 0.95)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#E04848';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('something went wrong', W/2, H/2 - 8);
        ctx.fillStyle = '#E0D0B8';
        ctx.font = '7px monospace';
        ctx.fillText('tap to restart', W/2, H/2 + 8);
        canvas.addEventListener('click', () => { _loopError = false; hardReset(); requestAnimationFrame(loop); }, { once: true });
        canvas.addEventListener('touchstart', () => { _loopError = false; hardReset(); requestAnimationFrame(loop); }, { once: true });
        return;
    }
    requestAnimationFrame(loop);
}

document.getElementById('splash-version').textContent = VERSION;

// Draw splash logo: Crag (T-piece) with kawaii eyes in spring green
(function() {
    const lc = document.getElementById('splash-logo');
    if (!lc) return;
    const cx = lc.getContext('2d');
    cx.imageSmoothingEnabled = false;
    const t = 12; // tile size in logo
    // Crag (T-piece): top row + center below
    const cells = [[0,0],[1,0],[2,0],[1,1]];
    const ox = 6, oy = 6;
    for (let i = 0; i < cells.length; i++) {
        const [gx,gy] = cells[i];
        const x = ox + gx * t, y = oy + gy * t;
        cx.fillStyle = C.spring;
        cx.fillRect(x, y, t, t);
        cx.fillStyle = C.springHL;
        cx.fillRect(x, y, t, 1);
        cx.fillRect(x, y, 1, t);
        cx.fillStyle = C.springDark;
        cx.fillRect(x, y + t - 1, t, 1);
        cx.fillRect(x + t - 1, y, 1, t);
        // Spring coil decoration on non-face cells
        if (i > 0) {
            cx.fillStyle = C.springHL;
            cx.fillRect(x + 2, y + 2, 4, 2);
            cx.fillRect(x + 6, y + 5, 4, 2);
            cx.fillRect(x + 2, y + 8, 4, 2);
        }
    }
    // Kawaii eyes on cell (0,0)
    const ex = ox, ey = oy;
    cx.fillStyle = C.springDark;
    cx.fillRect(ex + 1, ey + 2, 3, 3);
    cx.fillRect(ex + 7, ey + 2, 3, 3);
    cx.fillStyle = '#FFFFF0';
    cx.fillRect(ex + 2, ey + 2, 1, 1);
    cx.fillRect(ex + 8, ey + 2, 1, 1);
    cx.fillStyle = 'rgba(255,255,240,0.35)';
    cx.fillRect(ex + 2, ey + 4, 1, 1);
    cx.fillRect(ex + 8, ey + 4, 1, 1);
    // Smile
    cx.fillStyle = C.springDark;
    cx.fillRect(ex + 4, ey + 7, 1, 1);
    cx.fillRect(ex + 7, ey + 7, 1, 1);
    cx.fillRect(ex + 5, ey + 8, 2, 1);
})();

init();
requestAnimationFrame(loop);
</script>
<script src="nn_agent.js"></script>
<script>
// Dev mode: ?dev=1 shows bot button
const _params = new URLSearchParams(location.search);
if (_params.has('dev')) {
    document.getElementById('botBtn').style.display = 'flex';
}

// Load NN weights on startup (silently fails if not available)
if (typeof nnAgent !== 'undefined') {
    nnAgent.load('nn_weights.json');
}

// Auto-play mode: ?autoplay=1 enables NN agent immediately
if (_params.has('autoplay')) {
    document.getElementById('botBtn').style.display = 'flex';
    const waitForAgent = setInterval(() => {
        if (typeof nnAgent !== 'undefined' && nnAgent.load) {
            nnAgent.load('nn_weights.json').then(() => {
                toggleBot();
                console.log('Auto-play enabled');
            });
            clearInterval(waitForAgent);
        }
    }, 100);
}
</script>
