<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Serpent Push</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: monospace;
  color: #e0e0e0;
  overflow: hidden;
  touch-action: none;
}
canvas {
  image-rendering: pixelated;
  border: 2px solid #333;
  border-radius: 4px;
}
#ui {
  display: flex; gap: 16px;
  margin-top: 12px;
  font-size: 14px;
  align-items: center;
}
#ui span { opacity: 0.7; }
#title {
  font-size: 22px;
  margin-bottom: 10px;
  color: #7ec8e3;
  letter-spacing: 2px;
}
#msg {
  margin-top: 10px;
  font-size: 16px;
  min-height: 24px;
  color: #ffd700;
}
.btn {
  background: #2a2a4a;
  border: 1px solid #555;
  color: #ccc;
  padding: 6px 14px;
  font-family: monospace;
  font-size: 13px;
  cursor: pointer;
  border-radius: 3px;
}
.btn:hover { background: #3a3a5a; }
#touch-controls {
  display: none;
  margin-top: 14px;
  gap: 4px;
}
#touch-controls button {
  width: 56px; height: 56px;
  font-size: 24px;
  background: #2a2a4a;
  border: 1px solid #555;
  color: #ccc;
  border-radius: 6px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#touch-controls button:active { background: #4a4a6a; }
@media (pointer: coarse) {
  #touch-controls { display: grid; grid-template-columns: 56px 56px 56px; grid-template-rows: 56px 56px 56px; }
}
</style>
</head>
<body>
<div id="title">SERPENT PUSH</div>
<canvas id="c"></canvas>
<div id="ui">
  <span>Level: <b id="lvlNum">1</b>/<b id="lvlTotal"></b></span>
  <span>Moves: <b id="moves">0</b></span>
  <span>Length: <b id="snakeLen">1</b></span>
  <button class="btn" onclick="undo()">Undo [Z]</button>
  <button class="btn" onclick="restartLevel()">Restart [R]</button>
</div>
<div id="msg"></div>
<div id="touch-controls">
  <div></div>
  <button onclick="move(0,-1)">^</button>
  <div></div>
  <button onclick="move(-1,0)">&lt;</button>
  <button onclick="move(0,1)">v</button>
  <button onclick="move(1,0)">&gt;</button>
  <div></div>
  <button onclick="undo()">Z</button>
  <button onclick="restartLevel()">R</button>
</div>

// Tile coordinates from DawnBlocker Ortho spritesheet
// Row Y: color pairs at [12,37], [68,93], [124,149], [180,205], [236,261], [292,317], [348,373], [404,429]
// Left col X: 4, 21, 38, 55, 72, 89, 106
// Colors: 0=blue, 1=teal, 2=green, 3=lime, 4=olive, 5=orange, 6=brown, 7=gray
// Right colors: 0=red, 1=pink, 2=purple, 3=dkpurple, 4=navy, 5=peach, 6=cream, 7=dkgray

const ROW_Y = [12, 37, 68, 93, 124, 149, 180, 205, 236, 261, 292, 317, 348, 373, 404, 429];
const COL_X = [4, 21, 38, 55, 72, 89, 106, 136, 153, 170, 187, 204, 221, 238];

// Tile type indices (columns): 0=full block, 1=tall block, 2=! box, 3=half block, 4=key, 5=tall slim, 6=ramp
// These are approximate — will adjust empirically
const TH_TALL = 21;  // tall tile height
const TH_SHORT = 14; // short tile height
const TW = 16;

// Tile definitions: {sx, sy, sw, sh} from the sheet
// Using color row index * 2 for tall row, * 2 + 1 for short row
function tileAt(col, colorRow, tall) {
  const rowIdx = colorRow * 2 + (tall ? 0 : 1);
  return { sx: COL_X[col], sy: ROW_Y[rowIdx], sw: TW, sh: tall ? TH_TALL : TH_SHORT };
}

  // Walls: purple (right col 2, color 2 = purple)
  wall:       tileAt(7, 2, true),   // red full block for walls
  wallShort:  tileAt(7, 2, false),

  // Crates: orange (left col, color 5 = orange)
  crate:      tileAt(2, 5, true),   // orange ! box
  crateDone:  tileAt(2, 2, true),   // green ! box (on target)

  // Snake: lime green (left col, color 3 = lime)
  snakeHead:  tileAt(2, 3, true),   // lime ! block as head
  snakeBody:  tileAt(0, 3, true),   // lime full block as body
  snakeTail:  tileAt(3, 3, true),   // lime half block as tail

  // Food: yellow/lime key
  food:       tileAt(4, 3, true),   // lime key

  // Target: teal diamond-ish
  target:     tileAt(4, 1, true),   // teal key as target marker

  floorTile:  tileAt(3, 7, false),  // gray short block

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let currentLevel = 0;
let grid = [];
let snake = [];
let crates = [];
let targets = [];
let foods = [];
let moveCount = 0;
let history = [];
let won = false;
let gridW, gridH;

document.getElementById('lvlTotal').textContent = LEVELS.length;

function loadLevel(idx) {
  const lvl = LEVELS[idx];
  const map = lvl.map;
  gridH = map.length;
  gridW = map[0].length;
  grid = [];
  snake = [];
  crates = [];
  targets = [];
  foods = [];
  moveCount = 0;
  history = [];
  won = false;

  for (let y = 0; y < gridH; y++) {
    grid[y] = [];
    for (let x = 0; x < gridW; x++) {
      const ch = map[y][x] || '.';
      switch(ch) {
        case '#': grid[y][x] = 'wall'; break;
        case '.': grid[y][x] = 'floor'; break;
        case '@': grid[y][x] = 'floor'; snake = [{x, y}]; break;
        case '$': grid[y][x] = 'floor'; crates.push({x, y}); break;
        case '+': grid[y][x] = 'floor'; targets.push({x, y}); break;
        case '*': grid[y][x] = 'floor'; crates.push({x, y}); targets.push({x, y}); break;
        case 'o': grid[y][x] = 'floor'; foods.push({x, y}); break;
        default:  grid[y][x] = 'floor'; break;
      }
    }
  }

  canvas.width = gridW * S;
  canvas.height = gridH * S;
  ctx.imageSmoothingEnabled = false;

  document.getElementById('lvlNum').textContent = idx + 1;
  document.getElementById('msg').textContent = lvl.name;
  updateUI();
  draw();
}

function updateUI() {
  document.getElementById('moves').textContent = moveCount;
  document.getElementById('snakeLen').textContent = snake.length;
}

// Draw a tile from the spritesheet, anchored at bottom of grid cell
function drawSprite(tile, gx, gy) {
  const dx = gx * S;
  const dy = gy * S + (S - tile.sh * SCALE);
  ctx.drawImage(sheet, tile.sx, tile.sy, tile.sw, tile.sh,
    dx, dy, tile.sw * SCALE, tile.sh * SCALE);
}

// Draw sprite centered in cell (for items that shouldn't anchor at bottom)
function drawSpriteCenter(tile, gx, gy) {
  const dx = gx * S + (S - tile.sw * SCALE) / 2;
  const dy = gy * S + (S - tile.sh * SCALE) / 2;
  ctx.drawImage(sheet, tile.sx, tile.sy, tile.sw, tile.sh,
    dx, dy, tile.sw * SCALE, tile.sh * SCALE);
}

function isWall(x, y) {
  if (x < 0 || y < 0 || x >= gridW || y >= gridH) return true;
  return grid[y][x] === 'wall';
}
function isCrate(x, y) { return crates.some(c => c.x === x && c.y === y); }
function isSnakeBody(x, y) {
  for (let i = 1; i < snake.length - 1; i++) {
    if (snake[i].x === x && snake[i].y === y) return true;
  }
  return false;
}
function isSnakeAny(x, y) { return snake.some(s => s.x === x && s.y === y); }
function isFood(x, y) { return foods.some(f => f.x === x && f.y === y); }
function isTarget(x, y) { return targets.some(t => t.x === x && t.y === y); }
function checkWin() {
  if (targets.length === 0) return false;
  return targets.every(t => isCrate(t.x, t.y));
}

function move(dx, dy) {
  if (won) return;
  const head = snake[0];
  const nx = head.x + dx;
  const ny = head.y + dy;
  if (isWall(nx, ny)) return;
  const willEat = isFood(nx, ny);
  for (let i = 1; i < snake.length; i++) {
    if (snake[i].x === nx && snake[i].y === ny) {
      if (i === snake.length - 1 && !willEat) continue;
      return;
    }
  }
  let pushedCrate = null;
  const crateIdx = crates.findIndex(c => c.x === nx && c.y === ny);
  if (crateIdx >= 0) {
    const cx = nx + dx;
    const cy = ny + dy;
    if (isWall(cx, cy)) return;
    if (isCrate(cx, cy)) return;
    if (isSnakeAny(cx, cy)) {
      const tail = snake[snake.length - 1];
      if (!(tail.x === cx && tail.y === cy && !willEat)) return;
    }
    pushedCrate = { idx: crateIdx, toX: cx, toY: cy };
  }
  history.push({
    snake: snake.map(s => ({...s})),
    crates: crates.map(c => ({...c})),
    foods: foods.map(f => ({...f})),
    moveCount,
  });
  if (pushedCrate) {
    crates[pushedCrate.idx].x = pushedCrate.toX;
    crates[pushedCrate.idx].y = pushedCrate.toY;
  }
  snake.unshift({x: nx, y: ny});
  if (willEat) {
    const fi = foods.findIndex(f => f.x === nx && f.y === ny);
    if (fi >= 0) foods.splice(fi, 1);
  } else {
    snake.pop();
  }
  moveCount++;
  updateUI();
  if (checkWin()) {
    won = true;
    draw();
    if (currentLevel < LEVELS.length - 1) {
      document.getElementById('msg').textContent = LEVELS[currentLevel].name + ' complete! Press SPACE for next level.';
    } else {
      document.getElementById('msg').textContent = 'You beat all levels!';
    }
    return;
  }
  draw();
}

function undo() {
  if (history.length === 0 || won) return;
  const state = history.pop();
  snake = state.snake;
  crates = state.crates;
  foods = state.foods;
  moveCount = state.moveCount;
  updateUI();
  draw();
}
function restartLevel() { loadLevel(currentLevel); }
function nextLevel() { if (currentLevel < LEVELS.length - 1) { currentLevel++; loadLevel(currentLevel); } }
function prevLevel() { if (currentLevel > 0) { currentLevel--; loadLevel(currentLevel); } }

function draw() {
  // Background
  ctx.fillStyle = '#16171a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Floor + walls from spritesheet
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      if (grid[y][x] === 'wall') {
        drawSprite(TILES.wall, x, y);
      } else {
        // Dark floor
        ctx.fillStyle = '#222034';
        ctx.fillRect(x * S, y * S, S, S);
        // Subtle checker
        if ((x + y) % 2 === 0) {
          ctx.fillStyle = '#2a2540';
          ctx.fillRect(x * S + 2, y * S + 2, S - 4, S - 4);
        }
      }
    }
  }

  // Targets
  for (const t of targets) {
    if (!isCrate(t.x, t.y)) {
      drawSpriteCenter(TILES.target, t.x, t.y);
    }
  }

  // Food
  for (const f of foods) {
    drawSpriteCenter(TILES.food, f.x, f.y);
  }

  // Crates from spritesheet
  for (const c of crates) {
    const onTarget = isTarget(c.x, c.y);
    drawSprite(onTarget ? TILES.crateDone : TILES.crate, c.x, c.y);
  }

  // Snake from spritesheet — draw back to front
  for (let i = snake.length - 1; i >= 0; i--) {
    const seg = snake[i];
    if (i === 0) {
      drawSprite(TILES.snakeHead, seg.x, seg.y);
    } else if (i === snake.length - 1) {
      drawSprite(TILES.snakeTail, seg.x, seg.y);
    } else {
      drawSprite(TILES.snakeBody, seg.x, seg.y);
    }
  }

  // Win overlay
  if (won) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffd700';
    ctx.font = `${SCALE * 10}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('CLEAR!', canvas.width/2, canvas.height/2);
  }
}

// Input
document.addEventListener('keydown', e => {
  if (won && e.key === ' ') { nextLevel(); return; }
  switch(e.key) {
    case 'ArrowUp':    case 'w': case 'W': move(0, -1); e.preventDefault(); break;
    case 'ArrowDown':  case 's': case 'S': move(0, 1);  e.preventDefault(); break;
    case 'ArrowLeft':  case 'a': case 'A': move(-1, 0); e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': move(1, 0);  e.preventDefault(); break;
    case 'z': case 'Z': undo(); break;
    case 'r': case 'R': restartLevel(); break;
    case '[': prevLevel(); break;
    case ']': nextLevel(); break;
  }
});

let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  e.preventDefault();
});
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  const threshold = 20;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (Math.abs(dx) > threshold) move(dx > 0 ? 1 : -1, 0);
  } else {
    if (Math.abs(dy) > threshold) move(0, dy > 0 ? 1 : -1);
  }
  if (won) nextLevel();
  e.preventDefault();
});
</script>
</body>
