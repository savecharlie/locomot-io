// ── GAME STATE ──
// ══════════════════════════════════════

let state = 'title'; // title, playing, gameover
let score = 0;
let highScore = parseInt(localStorage.getItem('cowCatcherHi') || '0');
let scrollY = 0;
let scrollSpeed = SCROLL_BASE;
let time = 0;
let shakeX = 0, shakeY = 0, shakeT = 0;

// UFO
let ufo = { x: GW / 2, y: 40, targetX: GW / 2, frame: 0, frameT: 0 };

// Cow
let cow = { x: GW / 2, y: GH - 80, vx: 0, vy: 0, onPlatform: false, frame: 0, frameT: 0,
            spaghettiF: 0, alive: true, dir: 0 };

// Beam
let beam = { active: false, energy: BEAM_ENERGY_MAX };

// Platforms
let platforms = [];
let platformIdCounter = 0;

// Particles
let particles = [];

// Stars (parallax background)
let stars = [];
for (let i = 0; i < 60; i++) {
    stars.push({
        x: Math.random() * GW,
        y: Math.random() * GH,
        size: Math.random() < 0.3 ? 2 : 1,
        speed: 0.1 + Math.random() * 0.4,
        bright: 0.3 + Math.random() * 0.7
    });
}

// Input
let touch = { down: false, x: GW / 2, y: GH / 2 };
let gamepad = { x: 0, beam: false };

// ══════════════════════════════════════
// ── PLATFORM GENERATION ──
// ══════════════════════════════════════

function makePlatform(y) {
    const minW = 50;
    const maxW = 140;
    const w = minW + Math.random() * (maxW - minW);
    const x = 10 + Math.random() * (GW - 20 - w);
    const type = Math.random();
    let ptype = 'solid';
    if (time > 500 && type < 0.15) ptype = 'moving';
    else if (time > 300 && type < 0.25) ptype = 'breakable';

    return {
        id: platformIdCounter++,
        x, y, w, h: PLATFORM_H,
        type: ptype,
        moveDir: Math.random() < 0.5 ? 1 : -1,
        moveSpeed: 0.3 + Math.random() * 0.5,
        broken: false,
        breakTimer: 0
    };
}

function initPlatforms() {
    platforms = [];
    // Ground platform
    platforms.push({ id: platformIdCounter++, x: 0, y: GH - 30, w: GW, h: PLATFORM_H, type: 'solid', moveDir: 0, moveSpeed: 0, broken: false, breakTimer: 0 });
    // Generate upward
    let py = GH - 80;
    while (py > -200) {
        py -= 40 + Math.random() * 60;
        platforms.push(makePlatform(py));
    }
}

function generatePlatformsAbove() {
    // Find highest platform
    let minY = Infinity;
    for (const p of platforms) if (p.y < minY) minY = p.y;
    // Generate more above if needed
    const topEdge = scrollY - 100;
    while (minY > topEdge) {
        minY -= 40 + Math.random() * 60;
        platforms.push(makePlatform(minY));
    }
}

// ══════════════════════════════════════
// ── PARTICLES ──
// ══════════════════════════════════════

function spawnParticles(x, y, count, color, speed) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = speed * (0.5 + Math.random());
        particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: 30 + Math.random() * 30,
            maxLife: 60,
            color,
            size: 1 + Math.random() * 2
        });
    }
}

function triggerShake(intensity) {
    shakeT = 8;
    shakeX = (Math.random() - 0.5) * intensity;
    shakeY = (Math.random() - 0.5) * intensity;
}

// ══════════════════════════════════════
// ── SPAGHETTIFICATION RENDERER ──
// ══════════════════════════════════════

function drawCowSpaghettified(img, frameIdx, cx, cy, spaghettiF, dir) {
    // spaghettiF: 0 = normal, 1 = fully spaghettified
    const fw = 48, fh = 48; // frame size in spritesheet
    const sx = frameIdx * fw;
    const drawW = COW_SIZE;
    const drawH = COW_SIZE;

    if (spaghettiF < 0.05) {
        // Normal draw
        ctx.drawImage(img, sx, 0, fw, fh, cx - drawW/2, cy - drawH/2, drawW, drawH);
        return;
    }

    // Strip-slice spaghettification
    const strips = 16;
    const stripH = fh / strips;
    const destStripH = drawH / strips;

    for (let i = 0; i < strips; i++) {
        const t = i / strips; // 0 at top, 1 at bottom
        // Stretch toward UFO (upward) — top strips stretch more
        const stretchY = spaghettiF * (1 - t) * drawH * 0.8;
        // Squeeze width as it stretches
        const squeeze = 1 - spaghettiF * (1 - t) * 0.6;
        const stripW = drawW * squeeze;
        const stripX = cx - stripW / 2;
        const stripY = cy - drawH/2 + destStripH * i - stretchY;

        ctx.drawImage(img,
            sx, stripH * i, fw, stripH,       // source
            stripX, stripY, stripW, destStripH  // dest
        );
    }
}

// ══════════════════════════════════════
// ── BEAM RENDERER ──
// ══════════════════════════════════════

function drawBeam(ux, uy, cx, cy, energy) {
    const t = energy / BEAM_ENERGY_MAX;
    const alpha = 0.3 + t * 0.4;

    // Vortex beam — wide at cow, pinches at UFO
    const steps = 20;
    for (let i = 0; i <= steps; i++) {
        const frac = i / steps; // 0=UFO, 1=cow
        const y = uy + (cy - uy) * frac;
        const width = 2 + Math.pow(frac, 0.5) * 20 * t;
        const x = ux + (cx - ux) * frac;

        // Swirl offset
        const swirl = Math.sin(frac * 8 + time * 0.1) * frac * 4;

        ctx.globalAlpha = alpha * (0.5 + frac * 0.5);
        ctx.fillStyle = `hsl(${140 + frac * 40}, 80%, ${60 + frac * 20}%)`;
        ctx.fillRect(x - width/2 + swirl, y - 2, width, (cy - uy) / steps + 2);
    }

    // Bright core
    ctx.globalAlpha = alpha * 0.6;
    ctx.strokeStyle = '#aaffcc';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ux, uy);
    for (let i = 1; i <= steps; i++) {
        const frac = i / steps;
        const y = uy + (cy - uy) * frac;
        const x = ux + (cx - ux) * frac;
        const swirl = Math.sin(frac * 8 + time * 0.1) * frac * 3;
        ctx.lineTo(x + swirl, y);
    }
    ctx.stroke();

    // Singularity glow at UFO
    const grad = ctx.createRadialGradient(ux, uy + 10, 0, ux, uy + 10, 12);
    grad.addColorStop(0, `rgba(180,255,200,${alpha})`);
    grad.addColorStop(1, 'rgba(180,255,200,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = grad;
    ctx.fillRect(ux - 12, uy - 2, 24, 24);

    ctx.globalAlpha = 1;
}

// ══════════════════════════════════════
// ── INPUT HANDLING ──
// ══════════════════════════════════════

function getCanvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) / rect.width * GW,
        y: (clientY - rect.top) / rect.height * GH
    };
}

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    const pos = getCanvasPos(t.clientX, t.clientY);
    touch.down = true;
    touch.x = pos.x;
    touch.y = pos.y;
    if (state === 'title' && gameReady) startGame();
    else if (state === 'gameover') startGame();
});

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    const pos = getCanvasPos(t.clientX, t.clientY);
    touch.x = pos.x;
    touch.y = pos.y;
});

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    touch.down = false;
});

canvas.addEventListener('mousedown', e => {
    const pos = getCanvasPos(e.clientX, e.clientY);
    touch.down = true;
    touch.x = pos.x;
    touch.y = pos.y;
    if (state === 'title' && gameReady) startGame();
    else if (state === 'gameover') startGame();
});

canvas.addEventListener('mousemove', e => {
    const pos = getCanvasPos(e.clientX, e.clientY);
    touch.x = pos.x;
});

canvas.addEventListener('mouseup', () => { touch.down = false; });

// Gamepad
function pollGamepad() {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gps) {
        if (!gp) continue;
        gamepad.x = Math.abs(gp.axes[0]) > 0.15 ? gp.axes[0] : 0;
        gamepad.beam = gp.buttons[0]?.pressed || gp.buttons[1]?.pressed || false;
        break;
    }
}

// ══════════════════════════════════════
// ── GAME LOGIC ──
// ══════════════════════════════════════

function startGame() {
    state = 'playing';
    score = 0;
    scrollY = 0;
    scrollSpeed = SCROLL_BASE;
    time = 0;
    platformIdCounter = 0;

    ufo.x = GW / 2; ufo.y = 40; ufo.targetX = GW / 2;
    cow.x = GW / 2; cow.y = GH - 60; cow.vx = 0; cow.vy = 0;
    cow.onPlatform = false; cow.alive = true; cow.spaghettiF = 0; cow.dir = 0;
    beam.active = false; beam.energy = BEAM_ENERGY_MAX;
    particles = [];

    initPlatforms();
}

function update(dt) {
    if (state !== 'playing') return;
    time++;

    pollGamepad();

    // UFO follows input
    if (touch.down) {
        ufo.targetX = touch.x;
        beam.active = true;
    } else if (gamepad.beam) {
        ufo.targetX = Math.max(UFO_SIZE/2, Math.min(GW - UFO_SIZE/2, ufo.x + gamepad.x * 4));
        beam.active = true;
    } else {
        if (gamepad.x !== 0) ufo.targetX = Math.max(UFO_SIZE/2, Math.min(GW - UFO_SIZE/2, ufo.x + gamepad.x * 4));
        beam.active = false;
    }

    // Smooth UFO movement
    ufo.x += (ufo.targetX - ufo.x) * 0.12;
    ufo.x = Math.max(UFO_SIZE/2, Math.min(GW - UFO_SIZE/2, ufo.x));

    // UFO animation
    ufo.frameT++;
    if (ufo.frameT > 8) { ufo.frameT = 0; ufo.frame = (ufo.frame + 1) % 4; }

    // Beam energy
    if (beam.active) {
        beam.energy = Math.max(0, beam.energy - BEAM_DRAIN);
        if (beam.energy <= 0) beam.active = false;
    } else {
        beam.energy = Math.min(BEAM_ENERGY_MAX, beam.energy + BEAM_RECHARGE);
    }

    // Cow physics
    cow.vy += GRAVITY;

    // Screen-space positions
    const cowScreenY = cow.y - scrollY;
    const ufoScreenY = ufo.y;
    const dist = Math.sqrt((ufo.x - cow.x) ** 2 + (ufoScreenY - cowScreenY) ** 2);

    if (beam.active && beam.energy > 0 && dist < BEAM_MAX_RANGE) {
        // Pull cow toward UFO
        cow.vy -= BEAM_PULL;
        cow.vx += (ufo.x - cow.x) * BEAM_LATERAL;

        // Spaghettification increases as cow gets closer to UFO
        const closeness = 1 - dist / BEAM_MAX_RANGE;
        cow.spaghettiF = Math.min(1, cow.spaghettiF + (closeness * 0.05));

        // Particles along beam
        if (time % 3 === 0) {
            const px = cow.x + (Math.random() - 0.5) * 10;
            const py = cow.y + (Math.random() - 0.5) * 10;
            spawnParticles(px, py - scrollY, 1, '#aaffaa', 0.5);
        }
    } else {
        // Return to normal
        cow.spaghettiF = Math.max(0, cow.spaghettiF - 0.03);
    }

    // Apply velocity
    cow.x += cow.vx;
    cow.y += cow.vy;

    // Friction
    cow.vx *= 0.95;

    // Wall bouncing
    if (cow.x < COW_SIZE/2) { cow.x = COW_SIZE/2; cow.vx = Math.abs(cow.vx) * 0.5; }
    if (cow.x > GW - COW_SIZE/2) { cow.x = GW - COW_SIZE/2; cow.vx = -Math.abs(cow.vx) * 0.5; }

    // Direction
    if (cow.vx > 0.3) cow.dir = 1;
    else if (cow.vx < -0.3) cow.dir = -1;

    // Platform collision
    cow.onPlatform = false;
    for (const p of platforms) {
        if (p.broken) continue;

        // Moving platforms
        if (p.type === 'moving') {
            p.x += p.moveDir * p.moveSpeed;
            if (p.x < 0) { p.x = 0; p.moveDir = 1; }
            if (p.x + p.w > GW) { p.x = GW - p.w; p.moveDir = -1; }
        }

        // Collision: cow landing on top of platform
        const pScreenY = p.y - scrollY;
        if (cow.vy > 0 &&
            cowScreenY + COW_SIZE/2 >= pScreenY &&
            cowScreenY + COW_SIZE/2 <= pScreenY + p.h + cow.vy + 2 &&
            cow.x + COW_SIZE/3 > p.x &&
            cow.x - COW_SIZE/3 < p.x + p.w) {

            cow.y = p.y - COW_SIZE/2 + scrollY;
            cow.vy = 0;
            cow.onPlatform = true;

            if (p.type === 'breakable') {
                p.breakTimer++;
                if (p.breakTimer > 30) {
                    p.broken = true;
                    spawnParticles(p.x + p.w/2, pScreenY, 8, '#8B7355', 1.5);
                    triggerShake(3);
                }
            }

            // Moving platform carries cow
            if (p.type === 'moving') {
                cow.x += p.moveDir * p.moveSpeed;
            }
        }
    }

    // Scrolling — camera follows cow upward
    const targetScroll = cow.y - GH * 0.6;
    if (targetScroll < scrollY) {
        scrollY += (targetScroll - scrollY) * 0.08;
    }

    // Minimum scroll speed (game gets faster)
    scrollSpeed = SCROLL_BASE + time * SCROLL_ACCEL;
    scrollY -= scrollSpeed;

    // Score based on height
    const height = Math.floor(-scrollY / 10);
    if (height > score) score = height;

    // Generate more platforms
    generatePlatformsAbove();

    // Remove platforms below screen
    platforms = platforms.filter(p => (p.y - scrollY) < GH + 50);

    // Cow walk animation
    cow.frameT++;
    if (cow.frameT > 10) { cow.frameT = 0; cow.frame = (cow.frame + 1) % 4; }

    // Update particles
    for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.02;
        p.life--;
    }
    particles = particles.filter(p => p.life > 0);

    // Shake decay
    if (shakeT > 0) {
        shakeT--;
        shakeX = (Math.random() - 0.5) * shakeT;
        shakeY = (Math.random() - 0.5) * shakeT;
    } else {
        shakeX = shakeY = 0;
    }

    // Game over — cow fell below screen
    if (cowScreenY > GH + 50) {
        state = 'gameover';
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('cowCatcherHi', highScore);
        }
        triggerShake(8);
    }
}

// ══════════════════════════════════════
// ── RENDERING ──
// ══════════════════════════════════════

function drawStars() {
    for (const s of stars) {
        const y = ((s.y + scrollY * s.speed) % GH + GH) % GH;
        ctx.globalAlpha = s.bright * 0.7;
        ctx.fillStyle = '#fff';
        ctx.fillRect(s.x, y, s.size, s.size);
    }
    ctx.globalAlpha = 1;
}

function drawGround() {
    const groundY = (GH - 30) - scrollY;
    if (groundY > GH) return;
    // Green pasture
    const grad = ctx.createLinearGradient(0, groundY, 0, groundY + 60);
    grad.addColorStop(0, '#4a7c3f');
    grad.addColorStop(1, '#2d5a1e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, groundY, GW, GH - groundY + 100);

    // Grass tufts
    ctx.fillStyle = '#5a9c4f';
    for (let x = 0; x < GW; x += 8) {
        const h = 2 + Math.sin(x * 0.5) * 2;
        ctx.fillRect(x, groundY - h, 3, h);
    }
}

function drawPlatforms() {
    for (const p of platforms) {
        if (p.broken) continue;
        const py = p.y - scrollY;
        if (py < -20 || py > GH + 20) continue;

        if (p.type === 'solid' && p.w === GW) continue; // ground drawn separately

        // Platform body
        let color1, color2;
        if (p.type === 'solid') { color1 = '#8B7355'; color2 = '#6B5335'; }
        else if (p.type === 'moving') { color1 = '#6688BB'; color2 = '#4466AA'; }
        else { color1 = '#BB8855'; color2 = '#996633'; } // breakable

        ctx.fillStyle = color1;
        ctx.fillRect(p.x, py, p.w, p.h);
        ctx.fillStyle = color2;
        ctx.fillRect(p.x, py + p.h - 2, p.w, 2);

        // Fence posts
        ctx.fillStyle = color2;
        ctx.fillRect(p.x, py - 4, 3, p.h + 4);
        ctx.fillRect(p.x + p.w - 3, py - 4, 3, p.h + 4);

        // Breakable crack indicator
        if (p.type === 'breakable' && p.breakTimer > 0) {
            ctx.fillStyle = '#333';
            const cx = p.x + p.w/2;
            ctx.fillRect(cx - 2, py + 1, 1, p.h - 2);
            ctx.fillRect(cx + 1, py + 2, 1, p.h - 3);
        }
    }
}

function drawCow() {
    const screenY = cow.y - scrollY;
    if (screenY < -50 || screenY > GH + 50) return;

    // Choose sprite based on state
    let img = cowRightImg;
    if (beam.active && cow.spaghettiF > 0.1) {
        img = cowBackImg; // being pulled up, show back
    } else if (cow.dir < 0) {
        // Flip for left
        ctx.save();
        ctx.translate(cow.x, screenY);
        ctx.scale(-1, 1);
        drawCowSpaghettified(cowRightImg, cow.frame, 0, 0, cow.spaghettiF, cow.dir);
        ctx.restore();
        return;
    }

    drawCowSpaghettified(img, cow.frame, cow.x, screenY, cow.spaghettiF, cow.dir);
}

function drawUFO() {
    const img = beam.active ? ufoBeamImg : ufoIdleImg;
    const fw = 64, fh = 64;
    const sx = ufo.frame * fw;
    ctx.drawImage(img, sx, 0, fw, fh, ufo.x - UFO_SIZE/2, ufo.y - UFO_SIZE/2, UFO_SIZE, UFO_SIZE);
}

function drawBeamEffect() {
    if (!beam.active || beam.energy <= 0) return;
    const cowScreenY = cow.y - scrollY;
    drawBeam(ufo.x, ufo.y + UFO_SIZE/2 - 5, cow.x, cowScreenY - COW_SIZE/4, beam.energy);
}

function drawParticles() {
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    // Score
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`HEIGHT: ${score}m`, 5, 14);

    // High score
    ctx.textAlign = 'right';
    ctx.fillStyle = '#aaa';
    ctx.fillText(`BEST: ${highScore}m`, GW - 5, 14);

    // Beam energy bar
    const barW = 50, barH = 4;
    const barX = GW / 2 - barW / 2;
    const barY = 6;
    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barW, barH);
    const fill = beam.energy / BEAM_ENERGY_MAX;
    const hue = fill * 120; // red to green
    ctx.fillStyle = `hsl(${hue}, 80%, 50%)`;
    ctx.fillRect(barX, barY, barW * fill, barH);
}

function drawTitle() {
    // Dark overlay
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, GW, GH);

    // Title
    ctx.fillStyle = '#7fff7f';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('COW', GW/2, GH * 0.3);
    ctx.fillText('CATCHER', GW/2, GH * 0.3 + 32);

    // UFO icon
    if (ufoIdleImg.complete) {
        ctx.drawImage(ufoIdleImg, 0, 0, 64, 64, GW/2 - 30, GH * 0.42, 60, 60);
    }

    // Instructions
    ctx.fillStyle = '#ccc';
    ctx.font = '10px monospace';
    ctx.fillText('TOUCH & HOLD to beam', GW/2, GH * 0.62);
    ctx.fillText('Move finger to steer UFO', GW/2, GH * 0.62 + 16);
    ctx.fillText('Pull the cow up through gaps!', GW/2, GH * 0.62 + 32);

    // Start prompt
    if (!gameReady) {
        ctx.fillStyle = '#888';
        ctx.font = '10px monospace';
        ctx.fillText('LOADING...', GW/2, GH * 0.82);
    } else {
        const blink = Math.sin(Date.now() * 0.005) > 0;
        if (blink) {
            ctx.fillStyle = '#7fff7f';
            ctx.font = 'bold 14px monospace';
            ctx.fillText('TAP TO START', GW/2, GH * 0.82);
        }
    }

    // High score
    if (highScore > 0) {
        ctx.fillStyle = '#aaa';
        ctx.font = '10px monospace';
        ctx.fillText(`BEST: ${highScore}m`, GW/2, GH * 0.88);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, GW, GH);

    ctx.fillStyle = '#ff6666';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('COW LOST!', GW/2, GH * 0.35);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`${score}m`, GW/2, GH * 0.45);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffdd44';
        ctx.font = '10px monospace';
        ctx.fillText('NEW RECORD!', GW/2, GH * 0.5);
    }

    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) {
        ctx.fillStyle = '#7fff7f';
        ctx.font = 'bold 12px monospace';
        ctx.fillText('TAP TO RETRY', GW/2, GH * 0.65);
    }
}

function render() {
    ctx.clearRect(0, 0, GW, GH);

    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, GH);
    skyGrad.addColorStop(0, '#0a0a2e');
    skyGrad.addColorStop(1, '#1a1a4e');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, GW, GH);

    ctx.save();
    ctx.translate(shakeX, shakeY);

    drawStars();
    drawGround();
    drawPlatforms();
    drawBeamEffect();
    drawCow();
    drawUFO();
    drawParticles();
    drawHUD();

    ctx.restore();

    if (state === 'title') drawTitle();
    else if (state === 'gameover') drawGameOver();
}

// ══════════════════════════════════════
// ── MAIN LOOP ──
// ══════════════════════════════════════

let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min(timestamp - lastTime, 33); // cap at ~30fps delta
    lastTime = timestamp;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

// Start loop immediately — render title even before assets load
requestAnimationFrame(gameLoop);

</script>
</body>
</html>
