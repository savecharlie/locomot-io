<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- SEO -->
  <title>LOCOMOT.IO - Free Browser Games & Creative Tools</title>
  <meta name="description" content="Free browser games and creative tools. Sediment (die-to-build platformer), Locomot (train combat), Figure 8 (ice puzzle), PixPad (pixel art editor), and more.">
  <meta name="keywords" content="browser games, free games, io games, pixel art, platformer, puzzle games, creative tools, sediment game">
  <link rel="canonical" href="https://locomot.io/">

  <!-- Open Graph -->
  <meta property="og:title" content="LOCOMOT.IO - Free Browser Games & Creative Tools">
  <meta property="og:description" content="Sediment, Locomot, Figure 8, PixPad, Sand Buddy, and more - all free in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://locomot.io/">
  <meta property="og:image" content="https://locomot.io/og-image.png">

  <meta name="theme-color" content="#1D2B30">
  <meta name="app-version" content="364">
  <link rel="manifest" href="manifest.json">

  <!-- Pixel Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #1D2B30;
      font-family: 'Press Start 2P', monospace;
      color: #68BBC4;
      overscroll-behavior: none;
    }

    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    header h1 {
      font-size: clamp(20px, 6vw, 36px);
      color: #68BBC4;
      text-shadow: 0 0 20px rgba(104, 187, 196, 0.5);
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    header p {
      font-size: clamp(8px, 2.5vw, 12px);
      color: #40ACBF;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .game-card {
      background: #2A474F;
      border: 2px solid #40ACBF;
      border-radius: 8px;
      padding: 24px 16px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      user-select: none;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: #68BBC4;
      box-shadow: 0 8px 24px rgba(104, 187, 196, 0.25);
    }

    .game-card:active {
      transform: translateY(0) scale(0.98);
    }

    .pixel-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    .game-card h2 {
      font-size: 14px;
      color: #68BBC4;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .game-card p {
      font-size: 8px;
      color: #40ACBF;
      line-height: 1.4;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      font-size: 8px;
      color: #2A474F;
    }

    .kofi-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ff5e5b;
      border: 2px solid #ff5e5b;
      border-radius: 6px;
      padding: 10px 16px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 16px;
    }

    .kofi-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 94, 91, 0.4);
    }

    .kofi-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .kofi-btn canvas {
      width: 24px;
      height: 24px;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    .kofi-btn span {
      font-size: 10px;
      color: #fff;
      letter-spacing: 0.5px;
    }

    @media (max-width: 600px) {
      .kofi-btn {
        padding: 8px 12px;
      }
      .kofi-btn span {
        font-size: 8px;
      }
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .game-grid {
        grid-template-columns: 1fr;
        padding: 16px;
        gap: 12px;
      }

      .game-card {
        flex-direction: row;
        padding: 16px;
        text-align: left;
      }

      .pixel-icon {
        width: 48px;
        height: 48px;
        margin-bottom: 0;
        margin-right: 16px;
        flex-shrink: 0;
      }

      .game-card h2 {
        font-size: 12px;
        margin-bottom: 4px;
      }

      .game-card p {
        font-size: 7px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>LOCOMOT.IO</h1>
    <p>Games & Toys</p>
  </header>

  <main class="game-grid">
    <a href="trains.html" class="game-card">
      <canvas class="pixel-icon" data-emoji="🚂"></canvas>
      <div>
        <h2>LOCOMOT</h2>
        <p>Train combat</p>
      </div>
    </a>

    <a href="ice_skater/" class="game-card">
      <img src="ice_skater/skater_side_skating_16x24.png" class="pixel-icon" alt="Figure ∞" style="object-fit:contain;transform:scaleX(-1)">
      <div>
        <h2>FIGURE ∞</h2>
        <p>Slide & solve puzzles</p>
      </div>
    </a>

    <a href="pixel.html" class="game-card">
      <canvas class="pixel-icon" data-emoji="✏️"></canvas>
      <div>
        <h2>PIXPAD</h2>
        <p>Create pixel art</p>
      </div>
    </a>

    <a href="painter/" class="game-card">
      <canvas class="pixel-icon" data-emoji="🖌️"></canvas>
      <div>
        <h2>PAINTER</h2>
        <p>Live portrait painting</p>
      </div>
    </a>

    <a href="sandbox/" class="game-card">
      <img src="sand-buddy-v2.png" class="pixel-icon" alt="Sand Buddy">
      <div>
        <h2>SAND BUDDY</h2>
        <p>Falling sand game</p>
      </div>
    </a>

    <a href="sediment/" class="game-card">
      <canvas class="pixel-icon" id="sediment-logo"></canvas>
      <div>
        <h2>SEDIMENT</h2>
        <p>Your deaths build the way</p>
      </div>
    </a>
  </main>

  <footer>
    <a href="https://ko-fi.com/sendivylove" class="kofi-btn" target="_blank" rel="noopener">
      <canvas id="kofi-icon" data-emoji="☕"></canvas>
      <span>Support on Ko-fi</span>
    </a>
    <div>LOCOMOT.IO</div>
  </footer>

  <script>
    // Convert emojis to pixel art using canvas
    function pixelateEmoji(canvas, emoji, pixelSize = 16, displaySize = 64) {
      canvas.width = pixelSize;
      canvas.height = pixelSize;

      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      // Draw emoji
      ctx.font = `${pixelSize * 0.85}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, pixelSize / 2, pixelSize / 2 + 1);

      // Set display size (CSS handles pixelation)
      canvas.style.width = displaySize + 'px';
      canvas.style.height = displaySize + 'px';
    }

    // Initialize all pixel icons (skip custom-drawn ones)
    document.querySelectorAll('.pixel-icon[data-emoji]').forEach(canvas => {
      const emoji = canvas.dataset.emoji;
      const isMobile = window.innerWidth < 600;
      pixelateEmoji(canvas, emoji, 16, isMobile ? 48 : 64);
    });

    // Initialize Ko-fi icon (smaller)
    const kofiIcon = document.getElementById('kofi-icon');
    if (kofiIcon) {
      pixelateEmoji(kofiIcon, '☕', 12, 24);
    }

    // Sediment logo: S-piece with kawaii eyes (48x48 canvas, same tile size as game)
    const sedLogo = document.getElementById('sediment-logo');
    if (sedLogo) {
      const S = 48;
      sedLogo.width = S;
      sedLogo.height = S;
      const sc = sedLogo.getContext('2d');
      sc.imageSmoothingEnabled = false;
      const isMob = window.innerWidth < 600;
      sedLogo.style.width = (isMob ? 48 : 64) + 'px';
      sedLogo.style.height = (isMob ? 48 : 64) + 'px';
      sedLogo.style.imageRendering = 'pixelated';
      const t = 12;
      const cells = [[0,0],[0,1],[1,1],[1,2]]; // upright S
      const col = '#B8A078', hl = '#E0D0A0', sh = '#685060';
      const ox = 12, oy = 6;
      for (const [cx,cy] of cells) {
        const x = ox + cx * t, y = oy + cy * t;
        sc.fillStyle = col;
        sc.fillRect(x, y, t, t);
        sc.fillStyle = hl;
        sc.fillRect(x, y, t, 1);
        sc.fillRect(x, y, 1, t);
        sc.fillStyle = sh;
        sc.fillRect(x, y + t - 1, t, 1);
        sc.fillRect(x + t - 1, y, 1, t);
      }
      // Kawaii eyes on cell (0,0)
      const ex = ox, ey = oy;
      sc.fillStyle = sh;
      sc.fillRect(ex + 1, ey + 2, 3, 3);
      sc.fillRect(ex + 7, ey + 2, 3, 3);
      sc.fillStyle = '#FFFFF0';
      sc.fillRect(ex + 2, ey + 2, 1, 1);
      sc.fillRect(ex + 8, ey + 2, 1, 1);
      sc.fillStyle = 'rgba(255,255,240,0.35)';
      sc.fillRect(ex + 2, ey + 4, 1, 1);
      sc.fillRect(ex + 8, ey + 4, 1, 1);
    }

    // Auto-update: fetch version from server, reload if stale
    fetch('version.txt?' + Date.now()).then(r => r.text()).then(v => {
      const serverVer = v.trim();
      const localVer = document.querySelector('meta[name="app-version"]')?.content;
      if (localVer && serverVer !== localVer) {
        // Nuke old SW and caches, then reload
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(r => r.unregister());
          });
          caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
        }
        setTimeout(() => location.reload(true), 300);
      }
    }).catch(() => {});
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
        reg.update();
      });
    }
  </script>
</body>
</html>
