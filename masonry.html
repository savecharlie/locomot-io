<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mortar — Masonry Builder</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
html, body { width:100%; height:100%; overflow:hidden; background:#5a7a5a; font-family:'Courier New',monospace; }
#game { width:100%; height:100%; display:block; }
#toolbar { position:fixed; bottom:0; left:0; right:0; height:90px; background:rgba(60,40,20,0.95); display:flex; align-items:center; justify-content:space-around; padding:8px; border-top:3px solid #2a1a0a; gap:6px; }
.tool-btn { width:72px; height:72px; border-radius:12px; border:3px solid #1a0a00; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; color:#ddd; cursor:pointer; transition: transform 0.1s, border-color 0.15s; }
.tool-btn.active { border-color:#ffcc44; transform:scale(1.08); box-shadow: 0 0 12px rgba(255,200,60,0.5); }
.tool-btn canvas { width:40px; height:40px; border-radius:6px; }
#status { position:fixed; top:8px; left:8px; color:#fff; font-size:13px; background:rgba(0,0,0,0.5); padding:6px 12px; border-radius:8px; pointer-events:none; }
#course-count { position:fixed; top:8px; right:8px; color:#ffcc44; font-size:15px; font-weight:bold; background:rgba(0,0,0,0.5); padding:6px 12px; border-radius:8px; pointer-events:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="status">Tap a tool, then work the wall</div>
<div id="course-count">Course: 1</div>
<div id="toolbar"></div>

<script>
// ==================== AUDIO ENGINE ====================
const Audio = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function noise(duration) {
    const c = ensure();
    const sz = c.sampleRate * duration;
    const buf = c.createBuffer(1, sz, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < sz; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  function thunk() {
    const c = ensure();
    const o = c.createOscillator(); const g = c.createGain(); const f = c.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 80 + Math.random()*40;
    f.type = 'lowpass'; f.frequency.value = 400;
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(0.35, c.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.18);
    o.connect(f).connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.2);
    // impact noise
    const s = c.createBufferSource(); s.buffer = noise(0.08);
    const g2 = c.createGain(); const f2 = c.createBiquadFilter();
    f2.type = 'bandpass'; f2.frequency.value = 600; f2.Q.value = 1;
    g2.gain.setValueAtTime(0.2, c.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.08);
    s.connect(f2).connect(g2).connect(c.destination);
    s.start(); s.stop(c.currentTime + 0.1);
    vibrate(30);
  }
  function squish() {
    const c = ensure();
    const s = c.createBufferSource(); s.buffer = noise(0.15);
    const g = c.createGain(); const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 300 + Math.random()*200;
    g.gain.setValueAtTime(0.15, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.15);
    s.connect(f).connect(g).connect(c.destination);
    s.start(); s.stop(c.currentTime + 0.2);
    vibrate(15);
  }
  function scrape() {
    const c = ensure();
    const s = c.createBufferSource(); s.buffer = noise(0.12);
    const g = c.createGain(); const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 1200 + Math.random()*800; f.Q.value = 2;
    g.gain.setValueAtTime(0.12, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.1);
    s.connect(f).connect(g).connect(c.destination);
    s.start(); s.stop(c.currentTime + 0.12);
    vibrate(10);
  }
  function trowelScrape() {
    const c = ensure();
    const s = c.createBufferSource(); s.buffer = noise(0.25);
    const g = c.createGain(); const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 800; f.Q.value = 0.8;
    g.gain.setValueAtTime(0.08, c.currentTime);
    g.gain.linearRampToValueAtTime(0.12, c.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.25);
    s.connect(f).connect(g).connect(c.destination);
    s.start(); s.stop(c.currentTime + 0.3);
  }
  function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
  return { thunk, squish, scrape, trowelScrape };
})();

// ==================== ISOMETRIC ENGINE ====================
const canvas = document.getElementById('game');
const cx = canvas.getContext('2d');

// Tile size for isometric projection
const TILE_W = 52;
const TILE_H = 26;
const BRICK_H_PX = 16; // visual height of a brick in pixels
const MORTAR_H_PX = 4;  // mortar joint visual height

// Wall grid: each cell is a brick slot
const WALL_COLS = 8;
const MAX_COURSES = 20;

// State
const wall = []; // wall[course][col] = { brick: bool, mortar: bool, mortarAge: 0, scraped: bool, tooled: bool }
let currentCourse = 0;
let activeTool = 'mortar'; // 'mortar', 'brick', 'scrape', 'tool'
let cameraY = 0;
let targetCameraY = 0;
let lastScrapeTime = 0;

// Initialize first course
function initCourse(c) {
  wall[c] = [];
  for (let i = 0; i < WALL_COLS; i++) {
    wall[c][i] = { brick: false, mortar: false, mortarAge: 0, scraped: false, tooled: false, excess: false, settleAnim: 0 };
  }
}
initCourse(0);

// Isometric projection: grid (col, course) → screen (x, y)
function isoToScreen(col, course) {
  const ox = canvas.width / 2 - (WALL_COLS * TILE_W) / 4;
  const oy = canvas.height - 140;
  const x = ox + col * (TILE_W / 2);
  const y = oy - course * (BRICK_H_PX + MORTAR_H_PX) + cameraY;
  return { x, y };
}

// Screen → grid (approximate hit test)
function screenToGrid(sx, sy) {
  const ox = canvas.width / 2 - (WALL_COLS * TILE_W) / 4;
  const oy = canvas.height - 140;
  const col = Math.round((sx - ox) / (TILE_W / 2));
  const course = Math.round((oy + cameraY - sy) / (BRICK_H_PX + MORTAR_H_PX));
  if (col >= 0 && col < WALL_COLS && course >= 0 && course <= currentCourse) {
    return { col, course };
  }
  return null;
}

// ==================== PROCEDURAL BRICK DRAWING ====================
const brickColors = [
  '#b5522a', '#a84825', '#c45e30', '#9e4020', '#b85a2e', '#a24a28', '#c06035', '#984020'
];

function drawBrickFace(x, y, w, h, colorIdx, settle) {
  const s = settle || 0;
  const yy = y - s * 3;
  const c = brickColors[colorIdx % brickColors.length];
  // Main face
  cx.fillStyle = c;
  cx.fillRect(x + 1, yy + 1, w - 2, h - 2);
  // Texture noise
  cx.globalAlpha = 0.15;
  for (let i = 0; i < 4; i++) {
    const nx = x + 2 + Math.random() * (w - 6);
    const ny = yy + 2 + Math.random() * (h - 5);
    cx.fillStyle = Math.random() > 0.5 ? '#000' : '#fff';
    cx.fillRect(nx, ny, 2 + Math.random()*3, 1 + Math.random()*2);
  }
  cx.globalAlpha = 1;
  // Highlight top edge
  cx.fillStyle = 'rgba(255,255,255,0.12)';
  cx.fillRect(x + 1, yy + 1, w - 2, 2);
  // Shadow bottom edge
  cx.fillStyle = 'rgba(0,0,0,0.15)';
  cx.fillRect(x + 1, yy + h - 3, w - 2, 2);
}

function drawMortarBed(x, y, w, filled, age, scraped, tooled) {
  if (!filled) {
    // Empty mortar slot — just a gap
    cx.fillStyle = '#555';
    cx.fillRect(x, y, w, MORTAR_H_PX);
    return;
  }
  // Mortar changes color as it dries
  const dryness = Math.min(age / 600, 1); // ~10 seconds to dry
  const wetR = 140, wetG = 140, wetB = 140;
  const dryR = 190, dryG = 185, dryB = 175;
  const r = Math.round(wetR + (dryR - wetR) * dryness);
  const g = Math.round(wetG + (dryG - wetG) * dryness);
  const b = Math.round(wetB + (dryB - wetB) * dryness);
  cx.fillStyle = `rgb(${r},${g},${b})`;
  cx.fillRect(x, y, w, MORTAR_H_PX);
  // Wet shine
  if (dryness < 0.4) {
    cx.fillStyle = `rgba(255,255,255,${0.15 * (1 - dryness/0.4)})`;
    cx.fillRect(x + 2, y, w - 4, 1);
  }
  // Tooled joint — concave line
  if (tooled) {
    cx.fillStyle = 'rgba(0,0,0,0.2)';
    cx.fillRect(x + 3, y + 1, w - 6, 2);
    cx.fillStyle = 'rgba(255,255,255,0.1)';
    cx.fillRect(x + 3, y + 1, w - 6, 1);
  }
  // Excess mortar indicator
  if (!scraped && filled) {
    cx.fillStyle = 'rgba(160,155,145,0.6)';
    // Ooze below
    cx.fillRect(x + 1, y + MORTAR_H_PX, 4 + Math.sin(x)*3, 2);
    cx.fillRect(x + w - 6, y + MORTAR_H_PX, 4, 2);
  }
}

// ==================== MAIN RENDER ====================
function render() {
  // Background — construction site
  const grad = cx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#87AECC');
  grad.addColorStop(0.6, '#a8c4d8');
  grad.addColorStop(1, '#6a8a5a');
  cx.fillStyle = grad;
  cx.fillRect(0, 0, canvas.width, canvas.height);

  // Ground
  const groundY = canvas.height - 130 + cameraY;
  cx.fillStyle = '#8B7355';
  cx.fillRect(0, groundY, canvas.width, canvas.height);
  // Concrete footing
  cx.fillStyle = '#999';
  cx.fillRect(canvas.width/2 - WALL_COLS*(TILE_W/2)/2 - 10, groundY - 8, WALL_COLS*(TILE_W/2) + 20, 12);
  cx.fillStyle = '#aaa';
  cx.fillRect(canvas.width/2 - WALL_COLS*(TILE_W/2)/2 - 10, groundY - 8, WALL_COLS*(TILE_W/2) + 20, 3);

  // Draw wall courses bottom to top
  for (let course = 0; course <= currentCourse && course < wall.length; course++) {
    const isOffset = course % 2 === 1; // Running bond offset
    for (let col = 0; col < WALL_COLS; col++) {
      const cell = wall[course][col];
      const pos = isoToScreen(col, course);
      const bw = TILE_W / 2 - 1;
      const offsetX = isOffset ? TILE_W / 4 : 0;

      // Mortar bed (between this course and previous)
      if (course > 0 || cell.mortar) {
        const mortarY = pos.y + BRICK_H_PX;
        drawMortarBed(pos.x + offsetX, mortarY, bw, cell.mortar, cell.mortarAge, cell.scraped, cell.tooled);
      }

      // Brick
      if (cell.brick) {
        const settle = cell.settleAnim > 0 ? cell.settleAnim : 0;
        drawBrickFace(pos.x + offsetX, pos.y, bw, BRICK_H_PX, (col * 3 + course * 7) % brickColors.length, settle);
        // Vertical mortar joint (head joint)
        if (col > 0 && wall[course][col-1].brick) {
          cx.fillStyle = 'rgba(150,148,140,0.8)';
          cx.fillRect(pos.x + offsetX - 1, pos.y, 2, BRICK_H_PX);
        }
      }
    }

    // Top mortar bed for current course (where new mortar goes)
    if (course === currentCourse) {
      const topPos = isoToScreen(0, course);
      const isOff = course % 2 === 1;
      // Show ghost mortar bed where you can spread
      for (let col = 0; col < WALL_COLS; col++) {
        const cell = wall[course][col];
        if (cell.brick && !wall[course + 1]) {
          // This course is complete here — show where next mortar goes
        }
      }
    }
  }

  // Draw "next course" guide if current course is full
  if (isCourseFull(currentCourse)) {
    if (!wall[currentCourse + 1]) {
      initCourse(currentCourse + 1);
      currentCourse++;
      document.getElementById('course-count').textContent = `Course: ${currentCourse + 1}`;
    }
  }

  // Active tool cursor indicator
  drawToolIndicator();
}

function isCourseFull(c) {
  if (!wall[c]) return false;
  for (let i = 0; i < WALL_COLS; i++) {
    if (!wall[c][i].brick) return false;
  }
  return true;
}

function drawToolIndicator() {
  // Small floating indicator near last touch
  if (lastTouch.x > 0) {
    cx.save();
    cx.globalAlpha = 0.6;
    cx.font = '20px serif';
    const icons = { mortar: '🪣', brick: '🧱', scrape: '🔪', tool: '👆' };
    cx.fillText(icons[activeTool] || '?', lastTouch.x + 15, lastTouch.y - 15);
    cx.restore();
  }
}

// ==================== INTERACTION ====================
const lastTouch = { x: -100, y: -100 };
let isDragging = false;

function handleStart(x, y) {
  lastTouch.x = x; lastTouch.y = y;
  isDragging = true;
  handleAction(x, y);
}

function handleMove(x, y) {
  if (!isDragging) return;
  lastTouch.x = x; lastTouch.y = y;
  handleAction(x, y);
}

function handleEnd() {
  isDragging = false;
}

function handleAction(x, y) {
  const grid = screenToGrid(x, y);
  if (!grid) return;
  const { col, course } = grid;
  if (!wall[course] || !wall[course][col]) return;
  const cell = wall[course][col];

  switch (activeTool) {
    case 'mortar':
      if (!cell.mortar) {
        // Can only mortar if course below is full (or this is course 0)
        if (course === 0 || (wall[course - 1] && wall[course - 1][col] && wall[course - 1][col].brick)) {
          cell.mortar = true;
          cell.mortarAge = 0;
          cell.excess = true;
          Audio.squish();
          setStatus('Mortar spread!');
        }
      }
      break;

    case 'brick':
      if (cell.mortar && !cell.brick) {
        cell.brick = true;
        cell.settleAnim = 1;
        cell.excess = true;
        Audio.thunk();
        setStatus('Brick placed!');
        // Check if course is now full
        if (isCourseFull(course)) {
          setTimeout(() => {
            if (!wall[course + 1]) {
              initCourse(course + 1);
              currentCourse = course + 1;
              document.getElementById('course-count').textContent = `Course: ${currentCourse + 1}`;
              // Scroll camera up
              targetCameraY = Math.max(0, (currentCourse - 3) * (BRICK_H_PX + MORTAR_H_PX));
              setStatus('New course! Spread mortar.');
            }
          }, 300);
        }
      } else if (!cell.mortar) {
        setStatus('Need mortar first!');
      }
      break;

    case 'scrape':
      if (cell.excess && !cell.scraped && cell.brick) {
        const now = Date.now();
        if (now - lastScrapeTime > 80) {
          cell.scraped = true;
          cell.excess = false;
          Audio.scrape();
          lastScrapeTime = now;
          setStatus('Joint scraped clean');
        }
      }
      break;

    case 'tool':
      if (cell.mortar && cell.scraped && !cell.tooled) {
        const dryness = cell.mortarAge / 600;
        if (dryness > 0.3 && dryness < 0.9) {
          cell.tooled = true;
          Audio.trowelScrape();
          setStatus('Joint tooled! Beautiful.');
        } else if (dryness <= 0.3) {
          setStatus('Too wet — wait a moment');
        } else {
          setStatus('Too dry to tool now');
        }
      }
      break;
  }
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// Touch events
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const r = canvas.getBoundingClientRect();
  handleStart(t.clientX - r.left, t.clientY - r.top);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  const r = canvas.getBoundingClientRect();
  handleMove(t.clientX - r.left, t.clientY - r.top);
}, { passive: false });

canvas.addEventListener('touchend', e => { e.preventDefault(); handleEnd(); }, { passive: false });

// Mouse fallback
canvas.addEventListener('mousedown', e => {
  const r = canvas.getBoundingClientRect();
  handleStart(e.clientX - r.left, e.clientY - r.top);
});
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  handleMove(e.clientX - r.left, e.clientY - r.top);
});
canvas.addEventListener('mouseup', handleEnd);

// ==================== TOOLBAR ====================
function buildToolbar() {
  const bar = document.getElementById('toolbar');
  const tools = [
    { id: 'mortar', label: 'Mortar', color: '#888', draw: drawMortarIcon },
    { id: 'brick', label: 'Brick', color: '#b5522a', draw: drawBrickIcon },
    { id: 'scrape', label: 'Scrape', color: '#ccc', draw: drawScrapeIcon },
    { id: 'tool', label: 'Tool', color: '#aaa', draw: drawToolIcon },
  ];

  tools.forEach(t => {
    const btn = document.createElement('div');
    btn.className = 'tool-btn' + (t.id === activeTool ? ' active' : '');
    btn.id = 'btn-' + t.id;
    btn.style.background = `rgba(${hexToRgb(t.color)}, 0.3)`;

    const cv = document.createElement('canvas');
    cv.width = 40; cv.height = 40;
    t.draw(cv.getContext('2d'));

    const lbl = document.createElement('span');
    lbl.textContent = t.label;

    btn.appendChild(cv);
    btn.appendChild(lbl);
    btn.addEventListener('click', () => selectTool(t.id));
    btn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); selectTool(t.id); }, { passive: false });
    bar.appendChild(btn);
  });
}

function selectTool(id) {
  activeTool = id;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + id).classList.add('active');
  const labels = { mortar: 'Drag to spread mortar', brick: 'Tap to place bricks', scrape: 'Swipe joints to scrape', tool: 'Run along dry joints' };
  setStatus(labels[id]);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function drawMortarIcon(c) {
  c.fillStyle = '#888'; c.fillRect(8, 20, 24, 12); // mortar blob
  c.fillStyle = '#aaa'; c.fillRect(10, 22, 20, 3); // shine
  c.fillStyle = '#666'; c.fillRect(15, 8, 10, 14); // bucket
  c.fillStyle = '#777'; c.fillRect(13, 8, 14, 3);
}

function drawBrickIcon(c) {
  c.fillStyle = '#b5522a'; c.fillRect(6, 12, 28, 16);
  c.fillStyle = 'rgba(255,255,255,0.15)'; c.fillRect(6, 12, 28, 3);
  c.fillStyle = 'rgba(0,0,0,0.15)'; c.fillRect(6, 25, 28, 3);
  c.fillStyle = '#944'; c.fillRect(6, 12, 28, 16); c.fillStyle='#b5522a'; c.fillRect(7,13,26,14);
}

function drawScrapeIcon(c) {
  c.fillStyle = '#bbb'; c.fillRect(14, 4, 4, 20); // handle
  c.fillStyle = '#999'; c.fillRect(8, 24, 16, 10); // blade
  c.fillStyle = '#aaa'; c.fillRect(8, 24, 16, 2);
  c.strokeStyle = '#777'; c.lineWidth = 1; c.strokeRect(8, 24, 16, 10);
}

function drawToolIcon(c) {
  c.fillStyle = '#aaa';
  c.beginPath(); c.arc(20, 14, 6, 0, Math.PI * 2); c.fill();
  c.fillRect(17, 18, 6, 16);
  c.fillStyle = '#888'; c.fillRect(16, 32, 8, 4);
}

// ==================== GAME LOOP ====================
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

let lastTime = 0;
function gameLoop(time) {
  const dt = time - lastTime;
  lastTime = time;

  // Age mortar
  for (let c = 0; c < wall.length; c++) {
    if (!wall[c]) continue;
    for (let i = 0; i < WALL_COLS; i++) {
      if (wall[c][i].mortar) wall[c][i].mortarAge += dt / 16;
      if (wall[c][i].settleAnim > 0) wall[c][i].settleAnim -= 0.05;
    }
  }

  // Smooth camera
  cameraY += (targetCameraY - cameraY) * 0.08;

  render();
  requestAnimationFrame(gameLoop);
}

window.addEventListener('resize', resize);
resize();
buildToolbar();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
